<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크롤리의 집</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* 레이아웃: 어두운 평면도 한 장. 방은 칸으로 놓이고, 누르면 그 칸 안에 물건이 펼쳐진다. 객식구 복도는 아래로 길게 빠진다. */
:root{
  color-scheme: dark;
  --bg:#0d1117;
  --room:#141a23;
  --room-deep:#10151d;
  --line:#2a3443;
  --ink:#dce3eb;
  --muted:#8592a4;
  --crimson:#c9475d;
  --teal:#7bbac7;
  --note:#e6d78e;
  --note-ink:#2b2718;
  --board:#e8ecef;
  --board-ink:#1b2937;
  --f-disp:'Gowun Batang','Noto Serif KR',serif;
  --f-body:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
  --f-hand:'Gaegu','Nanum Pen Script',cursive;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;
  padding-block:28px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1180px; margin:0 auto}
h1{font-family:var(--f-disp); font-weight:700; font-size:30px; margin:0 0 4px; letter-spacing:.02em; text-wrap:balance}
.lede{margin:0 0 22px; color:var(--muted); max-width:60ch}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px}

.plan{
  display:grid; gap:10px; grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-areas:"front entry entry" "study living kitchen" "util back ."; align-items:stretch;
}
@media (max-width:760px){
  .plan{grid-template-columns:minmax(0,1fr); grid-template-areas:"front" "entry" "living" "kitchen" "study" "util" "back"}
}
@media (min-width:761px){
  .plan{grid-template-areas:none; align-items:start}
  .plan > .room{grid-row:auto !important; grid-column:auto / span 1 !important}
  .plan > .room[data-room="front"], .plan > .room[data-room="study"], .plan > .room[data-room="util"]{grid-column:1 / span 1 !important}
  .plan > .room[data-room="entry"]{grid-column:2 / span 2 !important}
  .plan > .room[data-open="true"][data-room="living"],
  .plan > .room[data-open="true"][data-room="kitchen"]{grid-column:1 / -1 !important}
  .room[data-open="true"][data-room="living"] .room-body{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); align-content:start}
  .room[data-open="true"][data-room="kitchen"] .room-body{
    display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); align-content:start}
  .room[data-open="true"][data-room="entry"] .room-body{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.7fr); align-content:start}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(1){grid-column:1; grid-row:1}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(2){grid-column:2; grid-row:1}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(3){grid-column:1; grid-row:2}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(4){grid-column:2; grid-row:2}
  .room[data-open="true"][data-room="entry"] .room-body > :nth-child(1){grid-column:1; grid-row:1}
  .room[data-open="true"][data-room="entry"] .room-body > :nth-child(2){grid-column:1; grid-row:2}
  .room[data-open="true"][data-room="entry"] .room-body > :nth-child(3){grid-column:1; grid-row:3}
  .room[data-open="true"][data-room="entry"] .room-body > :nth-child(4){grid-column:2; grid-row:1 / span 3; border-left:1px dashed var(--line)}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(5){grid-column:1; grid-row:3}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(6){grid-column:2; grid-row:3}
  .room[data-open="true"] .room-body > .obj{min-width:0; align-content:start}
}
.room{
  position:relative; background:var(--room); border:1px solid var(--line); border-left:3px solid #6b2a37; border-radius:3px;
  min-width:0; display:flex; flex-direction:column;
}
.room[data-open="true"]{border-color:#3b6a76; border-left-color:var(--crimson)}
.room-head{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px; width:100%;
  background:none; border:0; text-align:left; padding:14px 14px 12px; cursor:pointer;
}
.rn{font-family:var(--f-disp); font-size:20px; font-weight:700}
.rh{font-size:12px; color:var(--muted); letter-spacing:.06em}
.room-head:hover .rh{color:var(--teal)}
.room[data-tv="on"] .rn::after,.room[data-tv="scare"] .rn::after{
  content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--teal); margin-left:9px; vertical-align:middle;
  animation:pulse 1.2s ease-in-out infinite;
}
.leak{min-height:1.6em; margin:0; padding:0 14px 12px; font-family:var(--f-disp); font-size:14px; color:var(--crimson); opacity:0; transition:opacity .6s}
.leak.show{opacity:1}
.sign{
  margin:0 14px 12px; display:inline-block; border:1px solid var(--crimson); color:var(--crimson);
  font-size:12px; letter-spacing:.12em; padding:2px 8px;
}
.room-body{padding:0 0 6px; flex:1}
.obj{border-top:1px dashed var(--line); padding:12px 14px; display:grid; gap:8px; min-width:0}
.obj h3{margin:0; font-size:12px; font-weight:500; letter-spacing:.1em; color:var(--muted)}
.flavor{margin:0}
.btn{background:transparent; border:1px solid var(--line); border-radius:3px; padding:6px 12px; cursor:pointer; min-height:34px}
.btn:hover{border-color:var(--teal)}
.row{display:flex; gap:8px; flex-wrap:wrap}
.row input{flex:1 1 120px; min-width:0}
input[type=text]{
  font:inherit; color:var(--ink); background:var(--room-deep); border:1px solid var(--line); border-radius:3px; padding:6px 10px; min-height:34px;
}
input[type=text]::placeholder{color:var(--muted)}
[hidden]{display:none!important}
textarea{font:inherit; color:var(--ink); background:var(--room-deep); border:1px solid var(--line); border-radius:3px; padding:6px 10px; width:100%; resize:vertical}

.hint{margin:0; font-size:12px; color:var(--muted)}
.empty{margin:0; font-size:13px; color:var(--muted)}

/* 텔레비전 */
.tv{
  position:relative; overflow:hidden; aspect-ratio:16/9; width:100%; max-width:100%; display:grid; place-items:center; text-align:center;
  padding:12px; background:#090c11; border:2px solid #222d3b; color:var(--muted); font-size:13px;
}
.tv.on{background:#13222c; color:var(--ink)}
.tv.on.drama{background:#231f2d}
.tv.on.msg::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px);
  animation:roll .5s steps(3) infinite;
}
.tv.scare{background:#2c0b12; color:#ff8a9c; font-family:var(--f-disp); font-size:clamp(18px,5vw,28px); font-weight:700; animation:shake .14s linear infinite}
.tv span{position:relative}
.tvwrap{display:grid; gap:8px; justify-items:start}

/* 메모와 화이트보드 */
.notice{
  position:relative; background:#e9e7e2; color:#16191f; border-top:3px solid var(--crimson);
  padding:20px 20px 16px; max-width:34ch; transform:rotate(-.6deg);
  box-shadow:0 12px 18px -14px rgba(0,0,0,.9);
}
.notice::before{
  content:""; position:absolute; top:-9px; left:50%; width:10px; height:10px; border-radius:50%;
  background:var(--crimson); box-shadow:0 2px 3px rgba(0,0,0,.5); transform:translateX(-50%);
}
.notice .lbl{display:block; margin-bottom:8px; font-size:10px; font-weight:500; letter-spacing:.3em; color:#7b818a}
.notice .ntext{margin:0; font-family:var(--f-disp); font-weight:700; font-size:17px; line-height:1.6; white-space:pre-line; overflow-wrap:anywhere}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip[aria-pressed="true"]{border-color:var(--teal); color:var(--teal)}
.whiteboard{background:var(--board); color:var(--board-ink); font-family:var(--f-hand); font-size:24px; line-height:1.4; padding:16px 20px; border:4px solid #9aa6b2; min-height:170px; width:100%; box-sizing:border-box}
.whiteboard ul{list-style:none; margin:0; padding:0; display:grid; gap:4px}
.whiteboard li{display:flex; justify-content:space-between; gap:8px; align-items:baseline; border-bottom:1px dashed #c3ccd5}
.whiteboard .t{min-width:0; overflow-wrap:anywhere}
.whiteboard .empty{color:#5e6c7a}
.erase{font:12px var(--f-body); background:none; border:1px solid #9aa6b2; color:#5e6c7a; border-radius:3px; cursor:pointer; padding:0 6px}
.gb{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.gb li{border-left:2px solid var(--line); padding-left:10px; min-width:0}
.gb .who{font-weight:500}
.gb .when{font-size:12px; color:var(--muted); margin-left:6px}
.gb .msg{margin:0; overflow-wrap:anywhere}
.gb .del{margin-top:2px; font-size:12px; min-height:0; padding:1px 8px; color:var(--crimson); border-color:#5a2a34}
.foods{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:6px}
.food{text-align:center; padding:6px 6px; background:var(--room-deep); overflow-wrap:anywhere}
.fridge2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; width:100%}
.fcol{display:grid; gap:4px; align-content:start; min-width:0}
.fcap{font-size:12px; letter-spacing:.08em; color:var(--muted)}
.food.vacant{display:grid; place-items:center; min-height:34px; border:1px dashed var(--line); border-radius:3px; color:var(--muted); font-size:13px}
.mgrid{display:grid; grid-template-columns:repeat(5,minmax(0,46px)); gap:5px}
.mcell{aspect-ratio:1; min-height:0; padding:0; font-variant-numeric:tabular-nums}
.mcell.none{color:#7d8896; background:#0d1117; border-color:#222a34}
.mcell.win{color:#ffe27a; background:#2b2410; border-color:#e6c85a; font-size:18px}
.mcell.dud{color:#ff6b7d; background:#2a1016; border-color:#c0354a; font-size:18px}
.mcell.none[disabled]{opacity:.8}
.mcell.win[disabled],.mcell.dud[disabled]{opacity:1}
.mwrap{position:relative}
.mfx{position:absolute; inset:0; pointer-events:none; z-index:5}
.mfx .ring{position:absolute; border-radius:4px; box-shadow:0 0 0 0 rgba(255,226,122,.9); animation:ring 1.1s ease-out forwards}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,226,122,.95),0 0 14px 2px rgba(255,226,122,.9)} 100%{box-shadow:0 0 0 22px rgba(255,226,122,0),0 0 30px 14px rgba(255,226,122,0)}}
.mfx .conf{position:absolute; width:7px; height:11px; opacity:0; animation:conf 1.5s ease-out forwards}
@keyframes conf{0%{opacity:1; transform:translate(0,0) rotate(0)} 100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
.mfx .puff{position:absolute; width:16px; height:16px; border-radius:50%; background:rgba(150,156,166,.55); filter:blur(3px); opacity:0; animation:puff 1.7s ease-out forwards}
@keyframes puff{0%{opacity:.75; transform:translate(0,0) scale(.5)} 100%{opacity:0; transform:translate(var(--dx),-70px) scale(2.6)}}
.mfx .banner{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); background:rgba(10,13,18,.92); border:1px solid #e6c85a; color:#ffe27a; font-family:var(--f-disp); font-size:18px; font-weight:700; padding:12px 16px; border-radius:4px; text-align:center; width:max-content; max-width:94%; word-break:keep-all; line-height:1.5; animation:banner 2.6s ease-out forwards}
@keyframes banner{0%{opacity:0; transform:translate(-50%,-50%) scale(.6)} 12%{opacity:1; transform:translate(-50%,-50%) scale(1.08)} 22%{transform:translate(-50%,-50%) scale(1)} 85%{opacity:1} 100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ .mfx .ring,.mfx .conf,.mfx .puff{display:none} .mfx .banner{animation:none} }
.mcell:disabled{cursor:default}
.pager{justify-content:space-between}
.btn[disabled]{opacity:.4; cursor:default}

.odd{
  position:relative; width:100%; height:100%; padding:0; cursor:pointer; border-radius:2px;
  background:#1a1316; border:1px solid #4a2630; box-shadow:inset 0 0 0 6px rgba(0,0,0,.35), 0 10px 16px -10px var(--teal);
}
.odd::after{content:""; position:absolute; right:10px; top:58px; width:7px; height:7px; border-radius:50%; background:#7a3a47}
.doorway{width:96px; height:140px; padding:8px; background:#6d737b; border:1px solid #868d96; box-shadow:inset 0 0 0 4px rgba(0,0,0,.18)}
.shake{animation:shake .18s linear}
.utilgrid{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end}
.uitem{min-height:56px; padding:8px 12px; background:var(--room-deep)}
.tarot-out{display:grid; gap:2px; font-family:var(--f-disp)}
.tarot-out strong{color:var(--teal); font-weight:700}

/* 소파, 찬장, 싱크대, 기분 다이얼 */
.shelf{width:100%; align-self:stretch; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
.slot{border:1px solid var(--line); padding:8px; display:grid; gap:6px; align-content:start; min-width:0; background:var(--room-deep)}
.slot .sn{font-weight:500}
.slot .meter{letter-spacing:.12em; font-size:12px; color:var(--teal); overflow-wrap:anywhere}
.slot .empty{color:var(--muted); font-size:13px; margin:0}
.slot .btn{min-height:30px; padding:3px 10px; font-size:13px}
.wash{position:relative; overflow:hidden}
.wash .fill{position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(95,208,192,.38)}
.wash.go .fill{width:100%; transition:width 3s linear}
.wash .lbl2{position:relative}
.mood{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.mood .face{font-size:34px; line-height:1}
.gear{font-size:20px; line-height:1; transition:transform .5s}
.gear.spin{transform:rotate(360deg)}
@media (prefers-reduced-motion:reduce){ .gear{transition:none} }
/* 이주의 객식구, 칭찬과 고발 노트 */
.weekly{display:grid; gap:2px; margin:6px 0 10px; font-size:14px}
.weekly b{font-weight:500}
.weekly .good b{color:var(--teal)} .weekly .bad b{color:var(--crimson)}
.notebox{margin:0 0 12px}
.notepanel{margin-top:10px; border:1px dashed var(--line); padding:12px; display:grid; gap:10px; min-width:0}
.notepanel .row{align-items:center}
.nlist{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.nlist li{border-left:2px solid var(--line); padding-left:10px; min-width:0; display:grid; gap:4px}
.nlist li.good{border-left-color:var(--teal)} .nlist li.bad{border-left-color:var(--crimson)}
.ntag{font-size:12px; letter-spacing:.08em; margin-right:6px}
.nlist .good .ntag{color:var(--teal)} .nlist .bad .ntag{color:var(--crimson)}
.nlist .ntext{margin:0; overflow-wrap:anywhere}
.nvote{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted)}
.nvote .btn{min-height:28px; padding:2px 10px; font-size:13px}
.nvote .btn[aria-pressed="true"]{border-color:var(--teal); color:var(--teal)}
/* 객식구 복도 */
.corridor{margin-top:14px; border:1px solid var(--line); background:var(--room-deep); padding:14px 14px 10px; border-radius:3px}
.corridor h2{margin:0; font-family:var(--f-disp); font-size:18px}
.corridor .sub{margin:2px 0 12px; font-size:13px; color:var(--muted)}
.hall{display:flex; gap:12px; overflow-x:auto; padding:4px 2px 12px}
.door{
  flex:0 0 100px; height:156px; border:1px solid rgba(255,255,255,.14); border-radius:2px; cursor:pointer;
  display:grid; align-items:end; justify-items:center; padding:0 6px 12px; text-align:center; background:var(--dc);
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.22);
}
.door:hover{border-color:var(--teal)}
.door[aria-pressed="true"]{border-color:var(--teal); box-shadow:inset 0 0 0 5px rgba(0,0,0,.22), 0 0 0 2px var(--teal)}
.plate{white-space:pre-line; background:rgba(0,0,0,.45); font-size:12px; padding:2px 8px; border-radius:2px; overflow-wrap:anywhere}
.guestdesc{margin:4px 0 0; min-height:3em; font-family:var(--f-disp)}
.foot{margin:18px 0 0; font-size:12px; color:var(--muted)}

@keyframes roll{to{background-position:0 3px}}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-2px)}100%{transform:translate(0,0)}}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){
  .tv.on::before,.tv.scare,.room[data-tv] .rn::after{animation:none}
  .leak{transition:none}
  .shake{animation:none}
}
</style>

<main class="wrap">
  <h1>크롤리의 집</h1>
  <p class="lede">초인종은 누를 필요 없습니다. 방을 눌러서 들어와 보세요.<br>잠기지 않은 부분은 편하게 구경하셔도 됩니다.</p>

  <div class="plan" id="plan">
    <section class="room" data-room="front" style="grid-area:front">
      <button class="room-head" type="button" aria-expanded="false" aria-controls="b-front"><span class="rn">앞마당</span><span class="rh">나가기</span></button>
      <div class="room-body" id="b-front" hidden></div>
    </section>
    <section class="room" data-room="entry" style="grid-area:entry">
      <button class="room-head" type="button" aria-expanded="false" aria-controls="b-entry"><span class="rn">현관</span><span class="rh">들어가기</span></button>
      <div class="room-body" id="b-entry" hidden></div>
    </section>
    <section class="room" data-room="study" style="grid-area:study">
      <button class="room-head" type="button" aria-expanded="false" aria-controls="b-study"><span class="rn">서재</span><span class="rh">잠겨 있음</span></button>
      <p class="leak" id="leak" aria-live="polite"></p>
      <div class="room-body" id="b-study" hidden></div>
    </section>
    <section class="room" data-room="living" data-tv="off" style="grid-area:living">
      <button class="room-head" type="button" aria-expanded="false" aria-controls="b-living"><span class="rn">거실</span><span class="rh">들어가기</span></button>
      <div class="room-body" id="b-living" hidden></div>
    </section>
    <section class="room" data-room="kitchen" style="grid-area:kitchen">
      <button class="room-head" type="button" aria-expanded="false" aria-controls="b-kitchen"><span class="rn">부엌</span><span class="rh">들어가기</span></button>
      <p class="sign">네이선 출입금지</p>
      <div class="room-body" id="b-kitchen" hidden></div>
    </section>
    <section class="room" data-room="util" style="grid-area:util">
      <button class="room-head" type="button" aria-expanded="false" aria-controls="b-util"><span class="rn">다용도실</span><span class="rh">들어가기</span></button>
      <div class="room-body" id="b-util" hidden></div>
    </section>
    <section class="room" data-room="back" style="grid-area:back">
      <button class="room-head" type="button" aria-expanded="false" aria-controls="b-back"><span class="rn">뒷마당</span><span class="rh">나가기</span></button>
      <div class="room-body" id="b-back" hidden></div>
    </section>
  </div>

  <section class="corridor" aria-labelledby="hall-title">
    <h2 id="hall-title">객식구 복도</h2>
    <div class="weekly" id="weekly" aria-live="polite"></div>
    <div class="notebox" id="notes"></div>
    <p class="sub">밖에서 보이는 것보다 훨씬 깁니다. 쭉 살펴보세요.</p>
    <div class="hall" id="hall"></div>
    <p class="guestdesc" id="guestdesc" aria-live="polite">문을 하나 눌러보세요.</p>
  </section>

  <p class="foot">방은 객식구가 늘어날 때마다 추가됩니다. (판 5-1)</p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

var $ = function(s, el){ return (el || document).querySelector(s); };
function h(tag, attrs){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  var kids = Array.prototype.slice.call(arguments, 2);
  kids.forEach(function add(c){
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(add); return; }
    e.append(typeof c === 'object' ? c : document.createTextNode(String(c)));
  });
  return e;
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function pickN(a, n){
  var c = a.slice(), out = [];
  while (out.length < n && c.length) out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);
  return out;
}
function lsGet(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function fmt(ts){ try { return new Date(ts).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'}); } catch(e){ return ''; } }
function obj(title){
  var rest = Array.prototype.slice.call(arguments, 1);
  return h('div',{class:'obj'}, h('h3',null,title), rest);
}

var tv = { state:'off', kind:'msg', msg:'', t:null, d:null, armed:false };
function tvSync(){
  redraw('tv');
  $('[data-room="living"]').dataset.tv = tv.state;
}
function disarm(){ clearTimeout(tv.t); tv.armed = false; }
function armScare(){
  if (tv.state !== 'on' || tv.kind !== 'msg' || tv.armed) return;
  tv.armed = true;
  clearTimeout(tv.t);
  tv.t = setTimeout(function(){
    tv.armed = false;
    tv.state = 'scare';
    tvSync();
    tv.t = setTimeout(function(){ tv.state = 'off'; tvSync(); }, 3500);
  }, 9000);
}
function tvOff(){ disarm(); clearTimeout(tv.d); tv.state = 'off'; tvSync(); }
function tvOn(){
  if (document.hidden || tv.state !== 'off') return;
  tv.state = 'on';
  tv.kind = Math.random() < 0.55 ? 'msg' : 'drama';
  tv.msg = pick(tv.kind === 'msg' ? CONTENT.tv : CONTENT.drama);
  tvSync();
  clearTimeout(tv.d);
  if (tv.kind === 'drama'){
    tv.d = setTimeout(function(){
      if (tv.state === 'on' && tv.kind === 'drama'){ tv.state = 'off'; tvSync(); }
    }, 45000);
  } else if (openRoom === 'living') armScare();
}

var G = { page: 0, pages: [], err: '' };
function toRow(d){
  var x = d.data({ serverTimestamps: 'estimate' });
  return { n: x.n, t: x.t, ts: tsMs(x.ts), _doc: d };
}
function guestPage(){
  if (G.page > 0 && G.pages[G.page]) return G.pages[G.page];
  var rows = S.guestRemote.slice();
  S.guestLocal.forEach(function(e){ rows.push({ n:e.n, t:e.t, ts:e.ts, local:true }); });
  rows.sort(function(a,b){ return b.ts - a.ts; });
  return { rows: rows.slice(0, 8), more: rows.length > 8 };
}
async function guestOlder(){
  var cur = guestPage();
  if (!cur.more || !fs) return;
  var next = G.pages[G.page + 1];
  if (!next){
    var last = null;
    cur.rows.forEach(function(r){ if (r._doc) last = r._doc; });
    if (!last) return;
    try {
      var snap = await getDocs(query(collection(fs, 'guestbook'), orderBy('ts', 'desc'), startAfter(last), limit(9)));
      var rows = snap.docs.map(toRow);
      next = { rows: rows.slice(0, 8), more: rows.length > 8 };
      G.pages[G.page + 1] = next;
    } catch(e){
      G.err = '이전 글을 불러오지 못했어요.';
      redraw('guestbook');
      return;
    }
  }
  G.page++; G.err = '';
  redraw('guestbook');
}
function guestNewer(){
  if (G.page <= 0) return;
  G.page--; G.err = '';
  if (G.page === 0) G.pages = [];
  redraw('guestbook');
}

    catch(e){ shareFailed(); }
  }
  S.guestLocal = S.guestLocal.concat([{ n: name, t: t, ts: Date.now() }]).slice(-8);

}

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* 한 판에 당첨 1칸, 꽝 1칸. 둘 다 나오면 잠시 뒤 새 판이 시작된다. 선물은 화면 속 문구뿐이라 정답 위치를 숨기지 않는다 */
var M = { st: null, marks: {}, mine: {}, said: '', unsub: null, firstSnap: true, resetTried: 0, initTried: false };
function markerShared(){ return !!(canShare && fs && !S.off.marker); }
function randCells(){
  var w = Math.floor(Math.random()*25), d;
  do { d = Math.floor(Math.random()*25); } while (d === w);
  return { win: w, dud: d };
}
function markerText(k, m){
  var list = CONTENT.marker[k] || CONTENT.marker.none;
  var label = k === 'win' ? CONTENT.marker.winLabel + ' ' : k === 'dud' ? CONTENT.marker.dudLabel + ' ' : '';
  return label + list[m % list.length];
}
function markerCheckDone(){
  var st = M.st;
  if (!st || !M.marks[st.win] || M.resetTried === st.round) return;
  M.resetTried = st.round;
  setTimeout(function(){
    if (!M.st || M.st.round !== st.round) return;
    var n = randCells();
    if (markerShared()){
      setDoc(doc(fs, 'house', 'marker'), { round: st.round + 1, win: n.win, dud: n.dud }).catch(function(){});
    } else {
      M.st = { round: st.round + 1, win: n.win, dud: n.dud };
      M.marks = {}; M.mine = {}; M.said = CONTENT.marker.again;
      redraw('marker');
    }
  }, 4000);
}
function markerSubscribe(round){
  if (M.unsub) M.unsub();
  M.firstSnap = true;
  M.unsub = onSnapshot(query(collection(fs, 'markerMarks'), where('r', '==', round)), function(snap){
    var marks = {};
    snap.docs.forEach(function(d){
      var x = d.data();
      if (typeof x.c === 'number' && x.c >= 0 && x.c <= 24 && !marks[x.c]) marks[x.c] = { k: x.k, m: x.m };
    });
    if (!M.firstSnap){
      snap.docChanges().forEach(function(ch){
        if (ch.type !== 'added') return;
        var x = ch.doc.data();
        if (!M.mine[x.c] && (x.k === 'win' || x.k === 'dud')) M.said = CONTENT.marker.others[x.k];
      });
    }
    M.firstSnap = false;
    M.marks = marks;
    redraw('marker');
    markerCheckDone();
  }, featureOff('marker'));
}
function markerOnState(snap){
  if (!snap.exists()){
    if (!M.initTried){
      M.initTried = true;
      var n = randCells();
      setDoc(doc(fs, 'house', 'marker'), { round: 1, win: n.win, dud: n.dud }).catch(function(){});
    }
    return;
  }
  var d = snap.data();
  if (typeof d.round !== 'number' || typeof d.win !== 'number' || typeof d.dud !== 'number') return;
  var changed = !M.st || M.st.round !== d.round;
  var had = !!M.st;
  M.st = { round: d.round, win: d.win, dud: d.dud };
  if (changed){
    M.marks = {}; M.mine = {};
    if (had) M.said = CONTENT.marker.again;
    markerSubscribe(d.round);
  }
  redraw('marker');
}
function markerFx(k, c, text){
  var fx = M.fx, grid = M.grid;
  if (!fx || !grid || !fx.parentNode || !grid.children[c]) return;
  var g = grid.getBoundingClientRect(), r = grid.children[c].getBoundingClientRect();
  var base = fx.parentNode.getBoundingClientRect();
  var cx = r.left - base.left + r.width/2, cy = r.top - base.top + r.height/2;
  var made = [];
  function add(el){ fx.append(el); made.push(el); }
  if (k === 'win'){
    add(h('div',{class:'ring',style:'left:' + (r.left - base.left) + 'px;top:' + (r.top - base.top) + 'px;width:' + r.width + 'px;height:' + r.height + 'px'}));
    var cols = ['#ffe27a','#ff6b7d','#5fd0c0','#9bb8ff','#ffffff','#e6c85a'];
    for (var i = 0; i < 30; i++){
      var a = Math.random()*Math.PI*2, d = 50 + Math.random()*110;
      add(h('div',{class:'conf',style:'left:' + cx + 'px;top:' + cy + 'px;background:' + cols[i % cols.length] +
        ';--dx:' + Math.round(Math.cos(a)*d) + 'px;--dy:' + Math.round(Math.sin(a)*d + 40) + 'px;--rot:' + Math.round(Math.random()*720 - 360) + 'deg;animation-delay:' + Math.round(Math.random()*120) + 'ms'}));
    }
    add(h('div',{class:'banner'}, text));
  } else if (k === 'dud'){
    for (var j = 0; j < 7; j++){
      add(h('div',{class:'puff',style:'left:' + (cx - 8 + Math.random()*10 - 5) + 'px;top:' + (cy - 4) + 'px;--dx:' + Math.round(Math.random()*40 - 20) + 'px;animation-delay:' + (j*130) + 'ms'}));
    }
  }
  setTimeout(function(){ made.forEach(function(el){ el.remove(); }); }, 2800);
}
async function markCell(c){
  if (M.marks[c]) return;
  var st = M.st;
  if (!st){ M.said = '판을 불러오는 중이에요.'; redraw('marker'); return; }
  var k = c === st.win ? 'win' : c === st.dud ? 'dud' : 'none';
  var m = Math.floor(Math.random()*50);
  M.mine[c] = true;
  if (markerShared()){
    try { await setDoc(doc(fs, 'markerMarks', 'r' + st.round + 'c' + c), { r: st.round, c: c, k: k, m: m, ts: serverTimestamp() }); }
    catch(e){
      delete M.mine[c];
      M.said = '그 칸은 이미 눌렸거나, 지금은 누를 수 없어요.';
      redraw('marker');
      return;
    }
  } else {
    M.marks[c] = { k: k, m: m };
  }
  M.said = markerText(k, m);
  redraw('marker');
  markerFx(k, c, M.said);
  markerCheckDone();
}
function markerBox(){

function pantryDefaults(){ return { ck:'coffee', cn:PANTRY_N, s1k:'c1', s1n:PANTRY_N, s2k:'c2', s2n:PANTRY_N, cups:0, bowls:0 }; }
function pantryPick(d){ var o = {}; ['ck','cn','s1k','s1n','s2k','s2n','cups','bowls'].forEach(function(k){ o[k] = d[k]; }); return o; }

async function pantryAct(fn){

    var ref = doc(fs, 'house', 'pantry');
    await runTransaction(fs, async function(tx){
      var snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('nodoc');
      var next = fn(pantryPick(snap.data()));
      if (!next) throw new Error('blocked');
      tx.set(ref, next);

  } catch(e){ return false; }
}

      await new Promise(function(r){ setTimeout(r, 3000); });
    }
    washBtn.classList.remove('go');
    washing = false;
    if (!washBtn.isConnected){ return; }
    var gone = false;
    var ok = await pantryAct(function(d){ if (d.cups + d.bowls < 1){ gone = true; return null; } d.cups = 0; d.bowls = 0; return d; });
    said.textContent = ok ? C.wash : (gone ? C.washGone : C.fail); redrawPantryText();
  }}, washFill, h('span',{class:'lbl2'},'설거지하기'));
  function redrawPantryText(){ if (widgets.pantry) widgets.pantry(); }
  function sinkFull(d){ return d.cups + d.bowls >= SINK_MAX; }
  function slotEl(title, kindName, n, eatLabel, onEat, optionBtns, d){
    var kids = [h('div',{class:'sn'}, title), h('div',{class:'sn'}, kindName)];
    if (n > 0){
      kids.push(h('div',{class:'meter','aria-label':'남은 양 ' + n}, meter(n)));
      var b = h('button',{class:'btn',type:'button',disabled: sinkFull(d),onclick:onEat}, eatLabel);
      kids.push(b);
    } else {
      kids.push(h('p',{class:'empty'},'다 떨어졌다. 채울 걸 골라 주세요.'));
      kids.push(h('div',{class:'row'}, optionBtns));
    }
    return h('div',{class:'slot'}, kids);
  }
  async function eatCoffee(){
    var kind = '';
    var ok = await pantryAct(function(d){ if (d.cn < 1 || sinkFull(d)) return null; kind = d.ck; d.cn--; d.cups++; return d; });
    said.textContent = ok ? pick(C.eat[kind === 'cocoa' ? 'cocoa' : 'coffee']) : C.fail; redrawPantryText();
  }
  async function eatCereal(i){
    var ok = await pantryAct(function(d){ if (d['s'+i+'n'] < 1 || sinkFull(d)) return null; d['s'+i+'n']--; d.bowls++; return d; });
    said.textContent = ok ? pick(C.eat.cereal) : C.fail; redrawPantryText();
  }
  async function refillCoffee(kind){
    var ok = await pantryAct(function(d){ if (d.cn !== 0) return null; d.ck = kind; d.cn = PANTRY_N; return d; });
    said.textContent = ok ? C.coffee[kind] + '을(를) 채워 넣었다.' : C.fail; redrawPantryText();
  }
  async function refillCereal(i, kind){
    var other = i === 1 ? 's2k' : 's1k';
    var ok = await pantryAct(function(d){ if (d['s'+i+'n'] !== 0 || d[other] === kind) return null; d['s'+i+'k'] = kind; d['s'+i+'n'] = PANTRY_N; return d; });
    said.textContent = ok ? C.cereals[kind] + '을(를) 채워 넣었다.' : C.fail; redrawPantryText();
  }
  widgets.pantry = function(){
    var d = S.pantry;
    if (!pantryOk() || !d){
      shelf.replaceChildren(h('p',{class:'empty'}, pantryOk() ? '찬장을 여는 중이에요.' : '찬장은 아직 준비 중이에요.'));
      sinkTxt.textContent = ''; washBtn.hidden = true;
      return;
    }
    washBtn.hidden = false;
    var coffeeOpts = ['coffee','cocoa'].map(function(k){ return h('button',{class:'btn',type:'button',onclick:function(){ refillCoffee(k); }}, C.coffee[k]); });
    var slots = [slotEl('커피 칸', C.coffee[d.ck] || '', d.cn, '마시기', eatCoffee, coffeeOpts, d)];
    [1,2].forEach(function(i){
      var other = d[i === 1 ? 's2k' : 's1k'];
      var opts = Object.keys(C.cereals).filter(function(k){ return k !== other; }).map(function(k){
        return h('button',{class:'btn',type:'button',onclick:function(){ refillCereal(i, k); }}, C.cereals[k]);
      });
      slots.push(slotEl('시리얼 칸 ' + i, C.cereals[d['s'+i+'k']] || '', d['s'+i+'n'], '먹기', function(){ eatCereal(i); }, opts, d));
    });
    shelf.replaceChildren.apply(shelf, slots);
    sinkTxt.textContent = '컵 ' + d.cups + '개 · 그릇 ' + d.bowls + '개' + (sinkFull(d) ? ' — ' + C.full : '');
    washBtn.disabled = washing || d.cups + d.bowls < 1;
  };
  widgets.pantry();
  pantryEnsure();
  return {
    shelf: h('div',{class:'tvwrap',style:'width:100%'}, shelf, said),
    sink: h('div',{class:'tvwrap'}, sinkTxt, washBtn)
  };
}

/* 현관: 오늘의 기분 다이얼 */
function moodNow(){
  var d = S.mood;
  if (!d || typeof d.k !== 'number' || typeof d.ts !== 'number') return null;
  if (dayKST(d.ts) !== todayKST()) return null;
  return d;
}
function moodBox(){
  var faceEl = h('span',{class:'face','aria-hidden':'true'});
  var labelEl = h('span',null);
  var whoEl = h('p',{class:'hint'});
  var nameI = h('input',{type:'text',maxlength:'12',placeholder:'이름 (비워도 돼요)',autocomplete:'off','aria-label':'돌린 사람 이름'});
  var gear = h('button',{class:'btn gear',type:'button','aria-label':'다이얼 돌리기',onclick:async function(){
    if (!(canShare && fs) || S.off.mood) return;
    var cur = moodNow();
    var next = cur ? (cur.k + 1) % CONTENT.mood.length : 0;
    gear.classList.toggle('spin');
    try { await setDoc(doc(fs, 'house', 'mood'), { k: next, who: nameI.value.trim().slice(0, 12), ts: serverTimestamp() }); }
    catch(e){ whoEl.textContent = '지금은 돌릴 수 없어요.'; }
  }},'⚙️');
  widgets.mood = function(){
    var off = !(canShare && fs) || S.off.mood;
    gear.disabled = off; nameI.hidden = off;
    var cur = moodNow();
    if (off){ faceEl.textContent = '❔'; labelEl.textContent = '다이얼은 아직 준비 중이에요.'; whoEl.textContent = ''; return; }
    if (!cur){ faceEl.textContent = '❔'; labelEl.textContent = '오늘은 아직 아무도 돌리지 않았다.'; whoEl.textContent = ''; return; }
    var m = CONTENT.mood[cur.k % CONTENT.mood.length];
    faceEl.textContent = m.e; labelEl.textContent = m.t;
    whoEl.textContent = cur.who ? cur.who + '님이 돌려놨다.' : '';
  };
  widgets.mood();
  return h('div',{class:'tvwrap'}, h('div',{class:'mood'}, faceEl, labelEl, gear), nameI, whoEl);
}

/* ===== 칭찬과 고발 노트 ===== */
var auth = null;
var N = { notes: [], votes: [], week: '', unsubs: [], open: false, authOk: false, kind: 'good', err: '' };
function weekKey(now){
  var d = new Date((now == null ? Date.now() : now) + 9*3600*1000);
  var back = (d.getUTCDay() + 6) % 7;
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - back)).toISOString().slice(0, 10);
}
function normName(x){ return String(x == null ? '' : x).replace(/\s+/g,' ').trim().toLowerCase(); }
function myUid(){ return (auth && auth.currentUser) ? auth.currentUser.uid : ''; }
function noteCounts(){
  var c = {};
  N.votes.forEach(function(v){
    var x = c[v.n] || (c[v.n] = { u:0, d:0, mine:'' });
    if (v.v === 'u') x.u++; else if (v.v === 'd') x.d++;
    if (v.u && v.u === myUid()) x.mine = v.v;
  });
  return c;
}
function weeklyWinners(kind){
  var cnt = noteCounts(), by = {};
  N.notes.forEach(function(n){
    if (n.k !== kind) return;
    var key = normName(n.who);
    if (!key) return;
    var g = by[key] || (by[key] = { name: n.who, up: 0, down: 0 });
    var c = cnt[n.id];
    if (c){ g.up += c.u; g.down += c.d; }
  });
  var best = null, out = [];
  Object.keys(by).forEach(function(k){
    var g = by[k], score = g.up - g.down;
    if (g.up + g.down < CONTENT.notes.minVotes || score <= 0) return;
    if (best === null || score > best){ best = score; out = [g.name]; }
    else if (score === best) out.push(g.name);
  });
  return out;
}
function notesReady(){ return !!(canShare && fs && !S.off.notes); }
function notesSubscribe(){
  if (!notesReady()) return;
  var wk = weekKey();
  if (wk === N.week && N.unsubs.length) return;
  N.unsubs.forEach(function(u){ try { u(); } catch(e){} });
  N.unsubs = []; N.week = wk; N.notes = []; N.votes = [];
  N.unsubs.push(onSnapshot(query(collection(fs, 'notes'), where('w', '==', wk)), function(snap){
    N.notes = snap.docs.map(function(d){
      var x = d.data({ serverTimestamps: 'estimate' });
      return { id: d.id, k: x.k, who: x.who, t: x.t, by: x.by, u: x.u, ts: tsMs(x.ts) };
    }).sort(function(a, b){ return b.ts - a.ts; });
    redraw('notes');
  }, featureOff('notes')));
  N.unsubs.push(onSnapshot(query(collection(fs, 'noteVotes'), where('w', '==', wk)), function(snap){
    N.votes = snap.docs.map(function(d){ var x = d.data(); return { n: x.n, v: x.v, u: x.u }; });
    redraw('notes');
  }, featureOff('notes')));
}
async function noteVote(n, v){
  if (!notesReady() || !N.authOk || !myUid()) return;
  N.err = '';
  try {
    await setDoc(doc(fs, 'noteVotes', n.id + '_' + myUid()), { n: n.id, w: N.week, v: v, u: myUid(), ts: serverTimestamp() });
  } catch(e){ N.err = '표를 남기지 못했어요.'; redraw('notes'); }
}
async function noteAdd(kind, who, t, by){
  if (!notesReady() || !N.authOk || !myUid()) { N.err = '지금은 노트를 쓸 수 없어요.'; redraw('notes'); return false; }
  N.err = '';
  try {
    await addDoc(collection(fs, 'notes'), { k: kind, who: who.slice(0, 12), t: t.slice(0, 60), by: by.slice(0, 12), w: N.week || weekKey(), u: myUid(), ts: serverTimestamp() });
    return true;
  } catch(e){ N.err = '노트를 남기지 못했어요.'; redraw('notes'); return false; }
}
function notesMount(){
  var weeklyEl = $('#weekly'), host = $('#notes');
  var C = CONTENT.notes;
  var guestNames = [];
  CONTENT.guests.forEach(function(g){ var nm = g.name.replace(/\n/g, ' '); if (guestNames.indexOf(nm) < 0) guestNames.push(nm); });
  var kindBtns = { good: null, bad: null };
  function setKind(k){ N.kind = k; ['good','bad'].forEach(function(x){ kindBtns[x].setAttribute('aria-pressed', x === k ? 'true' : 'false'); }); }
  kindBtns.good = h('button',{class:'btn chip',type:'button',onclick:function(){ setKind('good'); }},'칭찬');
  kindBtns.bad = h('button',{class:'btn chip',type:'button',onclick:function(){ setKind('bad'); }},'고발');
  var whoI = h('input',{type:'text',maxlength:'12',placeholder:'누구에 대해서',list:'note-who-list',autocomplete:'off','aria-label':'대상 객식구'});
  var textI = h('input',{type:'text',maxlength:'60',placeholder:'무슨 일이 있었나요',autocomplete:'off','aria-label':'있었던 일'});
  var byI = h('input',{type:'text',maxlength:'12',placeholder:'쓴 사람 (필수)',required:true,autocomplete:'off','aria-label':'쓴 사람'});
  var statusP = h('p',{class:'hint'});
  var form = h('form',{class:'row',onsubmit:async function(e){
    e.preventDefault();
    var who = whoI.value.trim(), t = textI.value.trim(), by = byI.value.trim();
    if (!who || !t) return;
    if (!by){ N.err = '쓴 사람 이름을 적어 주세요.'; redraw('notes'); byI.focus(); return; }
    var ok = await noteAdd(N.kind, who, t, by);
    if (ok){ textI.value = ''; }
  }}, whoI, textI, byI, h('button',{class:'btn',type:'submit'},'남기기'));
  var formWrap = h('div',{class:'tvwrap',style:'width:100%'},
    h('div',{class:'row'}, kindBtns.good, kindBtns.bad), form);
  var list = h('ul',{class:'nlist'});
  var panel = h('div',{class:'notepanel',hidden:true},
    h('p',{class:'flavor'}, C.intro),
    h('datalist',{id:'note-who-list'}, guestNames.map(function(n){ return h('option',{value:n}); })),
    formWrap, statusP, list);
  var toggle = h('button',{class:'btn',type:'button','aria-expanded':'false',onclick:function(){
    N.open = !N.open; redraw('notes');
  }}, C.title + ' 펼치기');
  host.append(toggle, panel);
  setKind('good');

  widgets.notes = function(){
    var good = weeklyWinners('good'), bad = weeklyWinners('bad');
    weeklyEl.replaceChildren(
      h('div',{class:'good'}, C.goodTitle + ': ', h('b',null, good.length ? good.join(', ') : C.none)),
      h('div',{class:'bad'}, C.badTitle + ': ', h('b',null, bad.length ? bad.join(', ') : C.none))
    );
    toggle.textContent = C.title + (N.open ? ' 접기' : ' 펼치기');
    toggle.setAttribute('aria-expanded', N.open ? 'true' : 'false');
    panel.hidden = !N.open;
    var canWrite = notesReady() && N.authOk;
    formWrap.hidden = !canWrite;
    statusP.textContent = N.err || (!canShare ? '지금은 노트를 읽거나 쓸 수 없어요.' : (S.off.notes ? '노트는 아직 준비 중이에요.' : (canWrite ? '' : '잠시만요, 연결하는 중이에요.')));
    var cnt = noteCounts(), me = myUid();
    list.replaceChildren.apply(list, N.notes.length ? N.notes.slice(0, 30).map(function(n){
      var c = cnt[n.id] || { u: 0, d: 0, mine: '' };
      var own = !!me && n.u === me;
      var up = h('button',{class:'btn',type:'button','aria-pressed':c.mine === 'u' ? 'true' : 'false',disabled: own || !!c.mine || !canWrite,onclick:function(){ noteVote(n, 'u'); }}, '공감 ' + c.u);
      var down = h('button',{class:'btn',type:'button','aria-pressed':c.mine === 'd' ? 'true' : 'false',disabled: own || !!c.mine || !canWrite,onclick:function(){ noteVote(n, 'd'); }}, '비공감 ' + c.d);
      return h('li',{class:n.k === 'bad' ? 'bad' : 'good'},
        h('p',{class:'ntext'}, h('span',{class:'ntag'}, n.k === 'bad' ? '고발' : '칭찬'), h('b',null, n.who), '에 대해: ' + n.t),
        h('div',{class:'nvote'}, up, down, h('span',null, '— ' + n.by + (own ? ' (내 글)' : '')))
      );
    }) : [h('li',null,h('p',{class:'empty'}, C.empty))]);
  };
  widgets.notes();
}
notesMount();

/* ===== 객식구 복도 ===== */
(function(){
  var hall = $('#hall'), desc = $('#guestdesc');
  var doors = CONTENT.guests.map(function(g){
    var b = h('button',{class:'door',type:'button','aria-pressed':'false','aria-label':g.name.replace(/\n/g,' ') + ' 방 문',style:'--dc:' + g.color},
      h('span',{class:'plate'}, g.name));

      doors.forEach(function(d){ d.setAttribute('aria-pressed','false'); });

/* ===== 가끔 일어나는 일 ===== */
function loop(fn, min, max){
  function go(){ setTimeout(function(){ fn(); go(); }, (min + Math.random()*(max - min))*1000); }
  go();
}
var leakEl = $('#leak'), leakT = null;
function showLeak(){
  leakEl.textContent = pick(CONTENT.study);
  leakEl.classList.add('show');
  clearTimeout(leakT);
  leakT = setTimeout(function(){ leakEl.classList.remove('show'); }, 10000);
}
/* 서재: 모두에게 같은 시계로 정해진다. 약 9분 주기마다 2~4분 동안 크롤리가 들어와 있고, 그동안 40초쯤 간격으로 대사가 새어 나온다 */
var STUDY_CYCLE = 9*60*1000, lastLeak = 0;
function studyPresentAt(now){
  var slot = Math.floor(now / STUDY_CYCLE);
  var r = mulberry32(slot * 7919 + 17);
  var off = 30000 + r()*240000, dur = 120000 + r()*120000;
  var t = now - slot*STUDY_CYCLE;
  return t >= off && t < off + dur;
}
function studyTick(){
  var now = Date.now();
  var inside = studyPresentAt(now);
  var hint = $('.rh', $('[data-room="study"]'));
  if (inside && !studyIn){
    studyIn = true; hint.textContent = '인기척이 있음';
    if (!document.hidden){ showLeak(); lastLeak = now; }
  } else if (!inside && studyIn){
    studyIn = false; hint.textContent = '잠겨 있음';
  } else if (inside && !document.hidden && now - lastLeak >= 40000){
    showLeak(); lastLeak = now;
  }
}
studyTick();
setInterval(studyTick, 5000);
loop(tvOn, 45, 130);

/* ===== 공유 저장소 연결 ===== */
try {
  var app = initializeApp(firebaseConfig);
  fs = getFirestore(app);
  canShare = true;
  try {
    auth = getAuth(app);
    signInAnonymously(auth).then(function(){ N.authOk = true; redraw('notes'); }).catch(function(){ N.authOk = false; redraw('notes'); });
  } catch(e){ N.authOk = false; }
  notesSubscribe();
  setInterval(notesSubscribe, 60000);
  onSnapshot(query(collection(fs, 'guestbook'), orderBy('ts', 'desc'), limit(9)), function(snap){
    S.guestRemote = snap.docs.map(toRow);
    redraw('guestbook');
  }, shareFailed);
  onSnapshot(query(collection(fs, 'whiteboard'), orderBy('ts', 'desc'), limit(12)), function(snap){
    S.board = snap.docs.map(function(d){ var x = d.data({ serverTimestamps: 'estimate' }); return { id: d.id, t: x.t, ts: tsMs(x.ts) }; });
    redraw('board');
  }, shareFailed);
  onSnapshot(doc(fs, 'house', 'fridge'), function(snap){ S.fridge = snap.exists() ? snap.data() : null; redraw('fridge'); }, shareFailed);
  onSnapshot(doc(fs, 'house', 'doorNote'), function(snap){ S.door = snap.exists() ? snap.data() : null; redraw('door'); }, shareFailed);
  onSnapshot(doc(fs, 'house', 'fridgeUser'), function(snap){ S.fridgeUser = snap.exists() ? snap.data() : null; redraw('fridge'); }, featureOff('fridgeUser'));
  onSnapshot(doc(fs, 'house', 'marker'), markerOnState, featureOff('marker'));
  onSnapshot(doc(fs, 'house', 'sofa'), function(snap){
    if (!snap.exists()){ S.sofa = null; } else {
      var x = snap.data({ serverTimestamps: 'estimate' });
      S.sofa = { who: x.who, uid: x.uid, start: tsMs(x.start), rel: !!x.rel, blanket: !!x.blanket };
    }
    redraw('sofa');
  }, featureOff('sofa'));
  onSnapshot(doc(fs, 'house', 'pantry'), function(snap){
    S.pantry = snap.exists() ? snap.data() : null;
    if (!snap.exists()) pantryEnsure();
    redraw('pantry');
  }, featureOff('pantry'));
  onSnapshot(doc(fs, 'house', 'mood'), function(snap){
    if (!snap.exists()){ S.mood = null; } else {
      var x = snap.data({ serverTimestamps: 'estimate' });
      S.mood = { k: x.k, who: x.who || '', ts: tsMs(x.ts) };
    }
    redraw('mood');
  }, featureOff('mood'));
  onSnapshot(doc(fs, 'house', 'knock'), function(snap){ S.knock = snap.exists() ? snap.data() : null; redraw('knock'); }, featureOff('knock'));
  onSnapshot(doc(fs, 'house', 'fridgeStats'), function(snap){ S.fridgeStats = snap.exists() ? snap.data() : null; redraw('fridge'); }, featureOff('fridgeStats'));
} catch(e){ canShare = false; }
})();
