<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크롤리의 집</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* 레이아웃: 어두운 평면도 한 장. 방은 칸으로 놓이고, 누르면 그 칸 안에 물건이 펼쳐진다. 객식구 복도는 아래로 길게 빠진다. */
:root{
  color-scheme: dark;
  --bg:#0d1117;
  --room:#141a23;
  --room-deep:#10151d;
  --line:#2a3443;
  --ink:#dce3eb;
  --muted:#8592a4;
  --crimson:#c9475d;
  --teal:#7bbac7;
  --note:#e6d78e;
  --note-ink:#2b2718;
  --board:#e8ecef;
  --board-ink:#1b2937;
  --f-disp:'Gowun Batang','Noto Serif KR',serif;
  --f-body:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
  --f-hand:'Gaegu','Nanum Pen Script',cursive;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;
  padding-block:28px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1180px; margin:0 auto}
h1{font-family:var(--f-disp); font-weight:700; font-size:30px; margin:0 0 4px; letter-spacing:.02em; text-wrap:balance}
.lede{margin:0 0 22px; color:var(--muted); max-width:60ch}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px}

.plan{
  display:grid; gap:10px; grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-areas:"front entry entry" "study living kitchen" "util back ."; align-items:stretch;
}
@media (max-width:760px){
  .plan{grid-template-columns:minmax(0,1fr); grid-template-areas:"front" "entry" "living" "kitchen" "study" "util" "back"}
}
@media (min-width:761px){
  .plan{grid-template-areas:none; align-items:start}
  .plan > .room{grid-row:auto !important; grid-column:auto / span 1 !important}
  .plan > .room[data-room="front"], .plan > .room[data-room="study"], .plan > .room[data-room="util"]{grid-column:1 / span 1 !important}
  .plan > .room[data-room="entry"]{grid-column:2 / span 2 !important}
  .plan > .room[data-open="true"][data-room="living"],
  .plan > .room[data-open="true"][data-room="kitchen"]{grid-column:1 / -1 !important}
  .room[data-open="true"][data-room="living"] .room-body{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); align-content:start}
  .room[data-open="true"][data-room="kitchen"] .room-body{
    display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); align-content:start}
  .room[data-open="true"][data-room="entry"] .room-body{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.7fr); align-content:start}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(1){grid-column:1; grid-row:1}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(2){grid-column:2; grid-row:1}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(3){grid-column:1; grid-row:2}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(4){grid-column:2; grid-row:2}
  .room[data-open="true"][data-room="entry"] .room-body > :nth-child(1){grid-column:1; grid-row:1}
  .room[data-open="true"][data-room="entry"] .room-body > :nth-child(2){grid-column:1; grid-row:2}
  .room[data-open="true"][data-room="entry"] .room-body > :nth-child(3){grid-column:1; grid-row:3}
  .room[data-open="true"][data-room="entry"] .room-body > :nth-child(4){grid-column:2; grid-row:1 / span 3; border-left:1px dashed var(--line)}
  .room[data-open="true"][data-room="entry"] .room-body > :nth-child(5){grid-column:1 / -1; grid-row:4}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(5){grid-column:1; grid-row:3}
  .room[data-open="true"][data-room="kitchen"] .room-body > :nth-child(6){grid-column:2; grid-row:3}
  .room[data-open="true"] .room-body > .obj{min-width:0; align-content:start}
}
.room{
  position:relative; background:var(--room); border:1px solid var(--line); border-left:3px solid #6b2a37; border-radius:3px;
  min-width:0; display:flex; flex-direction:column;
}
.room[data-open="true"]{border-color:#3b6a76; border-left-color:var(--crimson)}
.room-head{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px; width:100%;
  background:none; border:0; text-align:left; padding:14px 14px 12px; cursor:pointer;
}
.rn{font-family:var(--f-disp); font-size:20px; font-weight:700}
.rh{font-size:12px; color:var(--muted); letter-spacing:.06em}
.room-head:hover .rh{color:var(--teal)}
.room[data-tv="on"] .rn::after,.room[data-tv="scare"] .rn::after{
  content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--teal); margin-left:9px; vertical-align:middle;
  animation:pulse 1.2s ease-in-out infinite;
}
.leak{min-height:1.6em; margin:0; padding:0 14px 12px; font-family:var(--f-disp); font-size:14px; color:var(--crimson); opacity:0; transition:opacity .6s}
.leak.show{opacity:1}
.sign{
  margin:0 14px 12px; display:inline-block; border:1px solid var(--crimson); color:var(--crimson);
  font-size:12px; letter-spacing:.12em; padding:2px 8px;
}
.room-body{padding:0 0 6px; flex:1}
.obj{border-top:1px dashed var(--line); padding:12px 14px; display:grid; gap:8px; min-width:0}
.obj h3{margin:0; font-size:12px; font-weight:500; letter-spacing:.1em; color:var(--muted)}
.flavor{margin:0}
.btn{background:transparent; border:1px solid var(--line); border-radius:3px; padding:6px 12px; cursor:pointer; min-height:34px}
.btn:hover{border-color:var(--teal)}
.row{display:flex; gap:8px; flex-wrap:wrap}
.row input{flex:1 1 120px; min-width:0}
input[type=text]{
  font:inherit; color:var(--ink); background:var(--room-deep); border:1px solid var(--line); border-radius:3px; padding:6px 10px; min-height:34px;
}
input[type=text]::placeholder{color:var(--muted)}
select{font:inherit; color:var(--ink); background:var(--room-deep); border:1px solid var(--line); border-radius:3px; padding:6px 8px; min-height:34px}
[hidden]{display:none!important}
textarea{font:inherit; color:var(--ink); background:var(--room-deep); border:1px solid var(--line); border-radius:3px; padding:6px 10px; width:100%; resize:vertical}

.hint{margin:0; font-size:12px; color:var(--muted)}
.empty{margin:0; font-size:13px; color:var(--muted)}

/* 텔레비전 */
.tv{
  position:relative; overflow:hidden; aspect-ratio:16/9; width:100%; max-width:100%; display:grid; place-items:center; text-align:center;
  padding:12px; background:#090c11; border:2px solid #222d3b; color:var(--muted); font-size:13px;
}
.tv.on{background:#13222c; color:var(--ink)}
.tv.on.drama{background:#231f2d}
.tv.on.msg::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px);
  animation:roll .5s steps(3) infinite;
}
.tv.scare{background:#2c0b12; color:#ff8a9c; font-family:var(--f-disp); font-size:clamp(18px,5vw,28px); font-weight:700; animation:shake .14s linear infinite}
.tv span{position:relative}
.tvwrap{display:grid; gap:8px; justify-items:start}

/* 메모와 화이트보드 */
.notice{
  position:relative; background:#e9e7e2; color:#16191f; border-top:3px solid var(--crimson);
  padding:20px 20px 16px; max-width:34ch; transform:rotate(-.6deg);
  box-shadow:0 12px 18px -14px rgba(0,0,0,.9);
}
.notice::before{
  content:""; position:absolute; top:-9px; left:50%; width:10px; height:10px; border-radius:50%;
  background:var(--crimson); box-shadow:0 2px 3px rgba(0,0,0,.5); transform:translateX(-50%);
}
.notice .lbl{display:block; margin-bottom:8px; font-size:10px; font-weight:500; letter-spacing:.3em; color:#7b818a}
.notice .ntext{margin:0; font-family:var(--f-disp); font-weight:700; font-size:17px; line-height:1.6; white-space:pre-line; overflow-wrap:anywhere}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip[aria-pressed="true"]{border-color:var(--teal); color:var(--teal)}
.whiteboard{background:var(--board); color:var(--board-ink); font-family:var(--f-hand); font-size:24px; line-height:1.4; padding:16px 20px; border:4px solid #9aa6b2; min-height:170px; width:100%; box-sizing:border-box}
.whiteboard ul{list-style:none; margin:0; padding:0; display:grid; gap:4px}
.whiteboard li{display:flex; justify-content:space-between; gap:8px; align-items:baseline; border-bottom:1px dashed #c3ccd5}
.whiteboard .t{min-width:0; overflow-wrap:anywhere}
.whiteboard .empty{color:#5e6c7a}
.erase{font:12px var(--f-body); background:none; border:1px solid #9aa6b2; color:#5e6c7a; border-radius:3px; cursor:pointer; padding:0 6px}
.gb{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.gb li{border-left:2px solid var(--line); padding-left:10px; min-width:0}
.gb .who{font-weight:500}
.gb .when{font-size:12px; color:var(--muted); margin-left:6px}
.gb .msg{margin:0; overflow-wrap:anywhere}
.gb .del{margin-top:2px; font-size:12px; min-height:0; padding:1px 8px; color:var(--crimson); border-color:#5a2a34}
.foods{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:6px}
.food{text-align:center; padding:6px 6px; background:var(--room-deep); overflow-wrap:anywhere}
.fridge2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; width:100%}
.fcol{display:grid; gap:4px; align-content:start; min-width:0}
.fcap{font-size:12px; letter-spacing:.08em; color:var(--muted)}
.vasewrap{width:100%; max-width:240px; margin:4px auto 8px}
.vasewrap svg{display:block; width:100%; height:auto}
.vasewrap .stem{stroke:#4c8a5a; stroke-width:2.5; stroke-linecap:round}
.vasewrap .flw{font-size:30px}
.vasewrap .vbody{fill:#2a3140; stroke:#566176; stroke-width:1.5}
.vasewrap .vrim{fill:#343c4d; stroke:#566176; stroke-width:1.2}
.vasewrap .vshine{stroke:rgba(255,255,255,.18); stroke-width:3; stroke-linecap:round}
.vnames{text-align:center}
.flavor:empty{display:none}
.pocketrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.subsofa{margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); display:grid; gap:4px}
.pocket{display:flex; flex-wrap:wrap; gap:6px}
.food.vacant{display:grid; place-items:center; min-height:34px; border:1px dashed var(--line); border-radius:3px; color:var(--muted); font-size:13px}
.mgrid{display:grid; grid-template-columns:repeat(5,minmax(0,46px)); gap:5px}
.mcell{aspect-ratio:1; min-height:0; padding:0; font-variant-numeric:tabular-nums}
.mcell.none{color:#7d8896; background:#0d1117; border-color:#222a34}
.mcell.win{color:#ffe27a; background:#2b2410; border-color:#e6c85a; font-size:18px}
.mcell.dud{color:#ff6b7d; background:#2a1016; border-color:#c0354a; font-size:18px}
.mcell.none[disabled]{opacity:.8}
.mcell.win[disabled],.mcell.dud[disabled]{opacity:1}
.mwrap{position:relative}
.mfx{position:absolute; inset:0; pointer-events:none; z-index:5}
.mfx .ring{position:absolute; border-radius:4px; box-shadow:0 0 0 0 rgba(255,226,122,.9); animation:ring 1.1s ease-out forwards}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,226,122,.95),0 0 14px 2px rgba(255,226,122,.9)} 100%{box-shadow:0 0 0 22px rgba(255,226,122,0),0 0 30px 14px rgba(255,226,122,0)}}
.mfx .conf{position:absolute; width:7px; height:11px; opacity:0; animation:conf 1.5s ease-out forwards}
@keyframes conf{0%{opacity:1; transform:translate(0,0) rotate(0)} 100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
.mfx .puff{position:absolute; width:16px; height:16px; border-radius:50%; background:rgba(150,156,166,.55); filter:blur(3px); opacity:0; animation:puff 1.7s ease-out forwards}
@keyframes puff{0%{opacity:.75; transform:translate(0,0) scale(.5)} 100%{opacity:0; transform:translate(var(--dx),-70px) scale(2.6)}}
.mfx .banner{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); background:rgba(10,13,18,.92); border:1px solid #e6c85a; color:#ffe27a; font-family:var(--f-disp); font-size:18px; font-weight:700; padding:12px 16px; border-radius:4px; text-align:center; width:max-content; max-width:94%; word-break:keep-all; line-height:1.5; animation:banner 2.6s ease-out forwards}
@keyframes banner{0%{opacity:0; transform:translate(-50%,-50%) scale(.6)} 12%{opacity:1; transform:translate(-50%,-50%) scale(1.08)} 22%{transform:translate(-50%,-50%) scale(1)} 85%{opacity:1} 100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ .mfx .ring,.mfx .conf,.mfx .puff{display:none} .mfx .banner{animation:none} }
.mcell:disabled{cursor:default}
.pager{justify-content:space-between}
.btn[disabled]{opacity:.4; cursor:default}

.odd{
  position:relative; width:100%; height:100%; padding:0; cursor:pointer; border-radius:2px;
  background:#1a1316; border:1px solid #4a2630; box-shadow:inset 0 0 0 6px rgba(0,0,0,.35), 0 10px 16px -10px var(--teal);
}
.odd::after{content:""; position:absolute; right:10px; top:58px; width:7px; height:7px; border-radius:50%; background:#7a3a47}
.doorway{width:96px; height:140px; padding:8px; background:#6d737b; border:1px solid #868d96; box-shadow:inset 0 0 0 4px rgba(0,0,0,.18)}
.shake{animation:shake .18s linear}
.utilgrid{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end}
.uitem{min-height:56px; padding:8px 12px; background:var(--room-deep)}
.tarot-out{display:grid; gap:2px; font-family:var(--f-disp)}
.tarot-out strong{color:var(--teal); font-weight:700}

/* 소파, 찬장, 싱크대, 기분 다이얼 */
.shelf{width:100%; align-self:stretch; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
.slot{border:1px solid var(--line); padding:8px; display:grid; gap:6px; align-content:start; min-width:0; background:var(--room-deep)}
.slot .sn{font-weight:500}
.slot .meter{letter-spacing:.12em; font-size:12px; color:var(--teal); overflow-wrap:anywhere}
.slot .empty{color:var(--muted); font-size:13px; margin:0}
.slot .btn{min-height:30px; padding:3px 10px; font-size:13px}
.wash{position:relative; overflow:hidden}
.wash .fill{position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(95,208,192,.38)}
.wash.go .fill{width:100%; transition:width 1s linear}
.wash .lbl2{position:relative}
.mood{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.mood .face{font-size:34px; line-height:1}
.gear{font-size:20px; line-height:1; transition:transform .5s}
.gear.spin{transform:rotate(360deg)}
@media (prefers-reduced-motion:reduce){ .gear{transition:none} }
/* 기분 구슬, 쿠키 칸, 책 읽기 */
.jars{width:100%; display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:8px}
.jarbtn{display:grid; gap:6px; justify-items:center; align-content:start; padding:8px 6px; min-height:96px; text-align:center; cursor:pointer;
  background:var(--room-deep); border:1px solid var(--line); border-radius:3px}
.jarbtn:hover:not(:disabled){border-color:var(--jc)}
.jarbtn:disabled{cursor:default; opacity:.75}
.jar{width:44px; height:54px; padding:3px; overflow:hidden; display:flex; flex-wrap:wrap-reverse; align-content:flex-start; justify-content:center; gap:1px;
  border:2px solid var(--jc); border-top-width:3px; border-radius:5px 5px 14px 14px}
.mb{display:block; width:9px; height:9px; border-radius:50%; background:var(--jc)}
.mb.new{animation:mbdrop .8s ease-out both}
@keyframes mbdrop{from{background:#cfd6df; transform:translateY(-22px)} to{background:var(--jc); transform:none}}
@media (prefers-reduced-motion:reduce){ .mb.new{animation:none} }
.subslot{border-top:1px dashed var(--line); padding-top:6px; display:grid; gap:6px}
.readline{margin:0; font-family:var(--f-disp)}
.seats{display:flex; align-items:center; gap:8px}
.seatdots{display:flex; gap:4px}
.seat{display:block; width:10px; height:10px; border-radius:50%; border:1.5px solid var(--line); box-sizing:border-box}
.seat.on{background:var(--crimson); border-color:var(--crimson)}
.bkcards{width:100%; display:grid; gap:6px}
.bkcard{display:grid; gap:2px; justify-items:start; width:100%; min-width:0; text-align:left; padding:9px 12px; font:inherit; color:inherit;
  background:var(--room-deep); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:3px}
button.bkcard{cursor:pointer}
button.bkcard:hover{border-color:var(--teal); border-left-color:var(--teal)}
.bkcard.occ{border-left-color:var(--teal)}
.bkcard.sel,.bkcard.mine{border-color:var(--crimson); border-left-color:var(--crimson)}
.bkhead{display:flex; justify-content:space-between; align-items:baseline; gap:8px; width:100%}
.bkname{font-family:var(--f-disp); font-weight:700; font-size:15px}
.bktag{font-size:12px; color:var(--teal)}
.bkcard.sel .bktag,.bkcard.mine .bktag{color:var(--crimson)}
.bkline{display:block; font-size:13px; line-height:1.5; overflow-wrap:anywhere}
.bkline.dim{color:var(--muted)}
.bkline b{font-weight:500; color:var(--note)}
.bkbook{font-family:var(--f-disp); font-size:14px; line-height:1.6}
.bktime{display:block; font-size:12px; color:var(--muted)}
.bkcard .btn{margin-top:6px}

/* 이주의 객식구, 칭찬과 고발 노트 */
.weekly{display:grid; gap:2px; margin:6px 0 10px; font-size:14px}
.weekly b{font-weight:500}
.weekly .good b{color:var(--teal)} .weekly .bad b{color:var(--crimson)}
.notebox{margin:0 0 12px}
.notepanel{margin-top:10px; border:1px dashed var(--line); padding:12px; display:grid; gap:10px; min-width:0}
.notepanel .row{align-items:center}
.nlist{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.nlist li{border-left:2px solid var(--line); padding-left:10px; min-width:0; display:grid; gap:4px}
.nlist li.good{border-left-color:var(--teal)} .nlist li.bad{border-left-color:var(--crimson)}
.ntag{font-size:12px; letter-spacing:.08em; margin-right:6px}
.nlist .good .ntag{color:var(--teal)} .nlist .bad .ntag{color:var(--crimson)}
.nlist .ntext{margin:0; overflow-wrap:anywhere}
.nvote{display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted)}
.nvote .btn{min-height:28px; padding:2px 10px; font-size:13px}
.nvote .btn[aria-pressed="true"]{border-color:var(--teal); color:var(--teal)}
/* 객식구 복도 */
.corridor{margin-top:14px; border:1px solid var(--line); background:var(--room-deep); padding:14px 14px 10px; border-radius:3px}
.corridor h2{margin:0; font-family:var(--f-disp); font-size:18px}
.corridor .sub{margin:2px 0 12px; font-size:13px; color:var(--muted)}
.hall{display:flex; gap:12px; overflow-x:auto; padding:4px 2px 12px}
.door{
  flex:0 0 100px; height:156px; border:1px solid rgba(255,255,255,.14); border-radius:2px; cursor:pointer;
  display:grid; align-items:end; justify-items:center; padding:0 6px 12px; text-align:center; background:var(--dc);
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.22);
}
.door:hover{border-color:var(--teal)}
.door[aria-pressed="true"]{border-color:var(--teal); box-shadow:inset 0 0 0 5px rgba(0,0,0,.22), 0 0 0 2px var(--teal)}
.door{position:relative}
.door[hidden]{display:none}
.spare{display:grid; gap:6px; margin:4px 0 8px}
.dsign{position:absolute; top:26px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:11px; line-height:1.3; padding:2px 7px; border-radius:2px; background:#1c1d22; border:1px solid #6b7078; color:#d6d8dc; box-shadow:0 1px 0 rgba(0,0,0,.5)}
.dsign::before{content:''; position:absolute; left:50%; top:-9px; width:1px; height:8px; background:#8a8d94}
.dsign[data-s="부재중"]{border-color:#7b8089; color:#c3c6cc}

var $ = function(s, el){ return (el || document).querySelector(s); };
function h(tag, attrs){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  var kids = Array.prototype.slice.call(arguments, 2);
  kids.forEach(function add(c){
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(add); return; }
    e.append(typeof c === 'object' ? c : document.createTextNode(String(c)));
  });
  return e;
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function pickN(a, n){
  var c = a.slice(), out = [];
  while (out.length < n && c.length) out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);
  return out;
}
function lsGet(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function fmt(ts){ try { return new Date(ts).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'}); } catch(e){ return ''; } }
function obj(title){
  var rest = Array.prototype.slice.call(arguments, 1);
  return h('div',{class:'obj'}, h('h3',null,title), rest);
}

var tv = { state:'off', kind:'msg', msg:'', t:null, d:null, armed:false };
function tvSync(){
  redraw('tv');
  $('[data-room="living"]').dataset.tv = tv.state;
}
function disarm(){ clearTimeout(tv.t); tv.armed = false; }
function armScare(){
  if (tv.state !== 'on' || tv.kind !== 'msg' || tv.armed) return;
  tv.armed = true;
  clearTimeout(tv.t);
  tv.t = setTimeout(function(){
    tv.armed = false;
    tv.state = 'scare';
    tvSync();
    tv.t = setTimeout(function(){ tv.state = 'off'; tvSync(); }, 3500);
  }, 9000);
}
function tvOff(){ disarm(); clearTimeout(tv.d); tv.state = 'off'; tvSync(); }
function tvOn(){
  if (document.hidden || tv.state !== 'off') return;
  tv.state = 'on';
  tv.kind = Math.random() < 0.55 ? 'msg' : 'drama';
  tv.msg = pick(tv.kind === 'msg' ? CONTENT.tv : CONTENT.drama);
  tvSync();
  clearTimeout(tv.d);
  if (tv.kind === 'drama'){
    tv.d = setTimeout(function(){
      if (tv.state === 'on' && tv.kind === 'drama'){ tv.state = 'off'; tvSync(); }
    }, 45000);
  } else if (openRoom === 'living') armScare();
}

var G = { page: 0, pages: [], err: '' };
function toRow(d){
  var x = d.data({ serverTimestamps: 'estimate' });
  return { n: x.n, t: x.t, ts: tsMs(x.ts), _doc: d };
}
function guestPage(){
  if (G.page > 0 && G.pages[G.page]) return G.pages[G.page];
  var rows = S.guestRemote.slice();
  S.guestLocal.forEach(function(e){ rows.push({ n:e.n, t:e.t, ts:e.ts, local:true }); });
  rows.sort(function(a,b){ return b.ts - a.ts; });
  return { rows: rows.slice(0, 8), more: rows.length > 8 };
}
async function guestOlder(){
  var cur = guestPage();
  if (!cur.more || !fs) return;
  var next = G.pages[G.page + 1];
  if (!next){
    var last = null;
    cur.rows.forEach(function(r){ if (r._doc) last = r._doc; });

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shoesNow(){
  var rnd = mulberry32(Math.floor(Date.now() / (30*60*1000)));
  var pool = CONTENT.shoes.concat(CONTENT.entryItems || []), n = 2 + Math.floor(rnd()*3), out = [];
  while (out.length < n && pool.length) out.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);
  return out;
}

/* 오른쪽 6칸: 방문자가 넣고 꺼내는 칸. 칸마다 이름(s)과 넣은 시각(t)을 따로 저장한다 */
function userSlots(){
  var d = S.fridgeUser || {}, out = [];
  for (var i = 0; i < 6; i++){
    var n = typeof d['s'+i] === 'string' ? d['s'+i] : '';
    var q = typeof d['q'+i] === 'number' ? Math.floor(d['q'+i]) : 1;   /* q가 없던 옛 기록은 1개 */
    if (q < 1) n = '';                                                  /* 0개 이하면 빈 칸으로 본다 */
    out.push({ n: n, q: Math.min(q, 5), t: typeof d['t'+i] === 'number' ? d['t'+i] : 0 });

}
async function saveUserSlot(i, name, qty){

/* ===== 식탁: 자리 3칸(20분)과 함께 나눠 먹는 접시 1개 ===== */
var TABLE_MS = 20 * 60000;
function tseatState(i){
  var d = S.tseat[i];
  if (!d || typeof d.start !== 'number') return null;
  var left = d.start + TABLE_MS - Date.now();
  if (d.rel || left <= 0) return null;
  return { who: d.who, uid: d.uid, start: d.start, left: left };
}
function tableMine(){
  var me = myUid();
  if (!me) return -1;
  for (var i = 0; i < CONTENT.table.seats; i++){ var st = tseatState(i); if (st && st.uid === me) return i; }
  return -1;
}
function tableCount(){ var n = 0; for (var i = 0; i < CONTENT.table.seats; i++){ if (tseatState(i)) n++; } return n; }
/* 접시는 누군가 앉아 있는 동안 보인다. 올릴 때 앉아 있던 사람이 모두 일어났으면 새 접시로 바꿀 수 있다(alive=false) */
function tplateState(){
  var p = S.tplate;
  if (!p || p.gone || typeof p.at !== 'number' || p.at + TABLE_MS <= Date.now()) return null;
  var names = [], alive = false;
  for (var i = 0; i < CONTENT.table.seats; i++){ var st = tseatState(i); if (st){ names.push(st.who); if (st.start <= p.at) alive = true; } }
  if (!names.length) return null;
  return { food: p.food, names: names, alive: alive };
}

    await setDoc(doc(fs, 'table', 'plate'), { food: String(food).slice(0, 40), who: tseatState(mine).who, uid: myUid(), at: serverTimestamp(), gone: false });
    return true;
  } catch(e){ return false; }
}

  var T = CONTENT.table;
  var msg = '', lastSig = '', timeEls = {}, hadPlate = false;
  var said = h('p',{class:'flavor','aria-live':'polite'});
  var msgP = h('p',{class:'hint','aria-live':'polite'});

  async function sit(){

      nameI.value = ''; msg = T.sit;
    } catch(err){ msg = T.race; }

    try {
      if (tplateState() && tableCount() <= 1) await updateDoc(doc(fs, 'table', 'plate'), { gone: true });
    } catch(err){}

    Object.keys(timeEls).forEach(function(i){

    var mine = tableMine(), n = tableCount(), pl = tplateState();
    var states = []; for (var i = 0; i < T.seats; i++) states.push(tseatState(i));
    var sig = JSON.stringify([states.map(function(st){ return st ? [st.who, st.uid] : 0; }), mine, msg, pl ? [pl.food, pl.names] : 0, N.authOk]);
    if (sig === lastSig){ tickTimes(); return; }
    lastSig = sig;
    seats.hidden = false; cards.hidden = false; form.hidden = mine >= 0; upBtn.hidden = mine < 0;
    sitBtn.disabled = !N.authOk;
    var dots = [];
    for (var d = 0; d < T.seats; d++) dots.push(h('i',{class:'seat' + (d < n ? ' on' : '')}));
    seatDots.replaceChildren.apply(seatDots, dots);
    seatTxt.textContent = '앉은 자리 ' + n + '/' + T.seats;
    timeEls = {};
    cards.replaceChildren.apply(cards, states.map(function(st, i){
      var isMine = i === mine;
      var tag = isMine ? '내 자리' : st ? '식사 중' : '';

      if (st){
        kids.push(h('span',{class:'bkline'}, h('b', null, st.who)));
        var tEl = h('span',{class:'bktime'}, '남은 시간 ' + clock(st.left));
        timeEls[i] = tEl; kids.push(tEl);

        kids.push(h('span',{class:'bkline dim'}, T.free));

    }));
    if (pl){ said.textContent = T.sharing.replace('{names}', pl.names.join(', ')).replace('{food}', pl.food); hadPlate = true; }
    else {
      if (hadPlate){ msg = msg || T.cleared; hadPlate = false; msgP.textContent = msg; }
      said.textContent = T.empty;
    }
    msgP.textContent = msg;
  };
  widgets.table();
  var tick = setInterval(function(){
    if (!said.isConnected){ clearInterval(tick); return; }
    if (widgets.table) widgets.table();
  }, 1000);
  return h('div',{class:'tvwrap',style:'width:100%'}, said, seats, cards, form, upBtn, msgP);
}

  var left = h('div',{class:'fcol'});
  var right = h('div',{class:'fcol'});

    for (var a = 0; a < sl.length; a++){ if (!sl[a].n){ i = a; break; } }
    if (i < 0){
      i = 0;
      for (var b = 1; b < sl.length; b++){ if (sl[b].t < sl[i].t) i = b; }

  async function takeLeft(i){
    var cur = slots().slice();

      var pl0 = tplateState();

      if (!(await tablePlace(old))){ said.textContent = CONTENT.table.fail; return; }

    await saveFridge(cur);
    bump('fridgeStats', 'out');

    counts.textContent = (canShare && !S.off.fridgeStats) ? '지금까지 넣은 음식 ' + (fs2.in || 0) + '개 · 꺼낸 음식 ' + (fs2.out || 0) + '개' : '';

    })));

/* ===== 마커판 (거실 테이블 위) ===== */
/* 한 판에 당첨 1칸, 꽝 1칸. 둘 다 나오면 잠시 뒤 새 판이 시작된다. 선물은 화면 속 문구뿐이라 정답 위치를 숨기지 않는다 */
var M = { st: null, marks: {}, mine: {}, said: '', unsub: null, firstSnap: true, resetTried: 0, initTried: false };
function markerShared(){ return !!(canShare && fs && !S.off.marker); }
function randCells(){
  var w = Math.floor(Math.random()*25), d;
  do { d = Math.floor(Math.random()*25); } while (d === w);
  return { win: w, dud: d };
}
function markerText(k, m){
  var list = CONTENT.marker[k] || CONTENT.marker.none;
  var label = k === 'win' ? CONTENT.marker.winLabel + ' ' : k === 'dud' ? CONTENT.marker.dudLabel + ' ' : '';
  return label + list[m % list.length];
}
function markerCheckDone(){
  var st = M.st;
  if (!st || !M.marks[st.win] || M.resetTried === st.round) return;
  M.resetTried = st.round;
  setTimeout(function(){
    if (!M.st || M.st.round !== st.round) return;
    var n = randCells();
    if (markerShared()){
      setDoc(doc(fs, 'house', 'marker'), { round: st.round + 1, win: n.win, dud: n.dud }).catch(function(){});
    } else {
      M.st = { round: st.round + 1, win: n.win, dud: n.dud };
      M.marks = {}; M.mine = {}; M.said = CONTENT.marker.again;
      redraw('marker');
    }
  }, 4000);

function markerSubscribe(round){

    var marks = {};

function candyStage(){

function candyTry(key){
  var C = CONTENT.candy, rule = C.actions[key];

  var today = todayKST();

  var used = CS.used[key] || 0;
  if (CS.pocket >= C.pocketMax){ candyToast(C.pocketFull); return false; }

  var got = (used < rule.cap || Math.random() < C.laterChance) ? Math.min(rule.n, C.pocketMax - CS.pocket) : 0;
  CS.pocket += got;
  candySave();
  if (got > 0) candyToast('🍬 사탕 ' + got + '개를 얻었다. (주머니 ' + CS.pocket + '/' + C.pocketMax + ')');

      '<path class="vshine" d="M96 160 C94 172 96 184 104 192" fill="none"/></svg>';

    lastP.textContent = last ? (last.who || '누군가') + V.by : V.empty;
    namesP.textContent = names.length ? names.join(' · ') + ' — ' + lastP.textContent : lastP.textContent;
    lastP.hidden = true;

    pocketEl.replaceChildren.apply(pocketEl, order.length ? order.map(function(id){
      var f = flowerById(id);
      return h('button',{class:'btn',type:'button',disabled: off,'aria-label':f.name + ' 꽂기',onclick:function(){ plant(id); }}, f.icon + ' ' + f.name + (groups[id] > 1 ? ' ×' + groups[id] : ''));
    }) : [h('span',{class:'hint'}, V.pocketEmpty)]);

  return h('div',{class:'tvwrap'}, shelf, namesP, said, lastP, h('div',{class:'pocketrow'}, h('span',{class:'fcap'}, '주머니'), pocketEl), h('div',{class:'row'}, whoI), status);
}

/* 소파: 15분(숨겨진 이름이면 30분) 동안 한 사람만 쉴 수 있다. 잠금은 규칙이 서버 시간으로 확인한다 */
function sofaState(id){
  var d = S[id];
  if (!d || typeof d.start !== 'number') return null;
  var left = d.start + (d.mins === 30 ? 30 : 15)*60000 - Date.now();
  if (d.rel || left <= 0) return null;
  return { who: d.who, uid: d.uid, left: left, blanket: !!d.blanket, start: d.start };
}
function asList(x){ return Array.isArray(x) ? x : [x]; }
function sofaBox(id){
  var freeLine = pick(asList(id === 'sofa' ? CONTENT.sofa.free : (CONTENT.sofa.freeSolo || CONTENT.sofa.free)));
  var said = h('p',{class:'flavor','aria-live':'polite'});
  var status = h('p',{class:'hint'});
  var nameI = h('input',{type:'text',maxlength:'12',placeholder:'이름',autocomplete:'off','aria-label':'쉴 사람 이름'});
  var restBtn = h('button',{class:'btn',type:'submit'},'휴식');
  var form = h('form',{class:'row',onsubmit:async function(e){
    e.preventDefault();
    var who = nameI.value.trim().replace(/\s+/g, ' ');
    if (!who) { status.textContent = '이름을 적어 주세요.'; return; }
    if (sofaState(id)) return;
    var mins = SOFA_EGG.indexOf(who.toLowerCase()) >= 0 ? 30 : 15;
    if (!(canShare && fs && !S.off[id] && N.authOk && myUid())){ status.textContent = '지금은 쉴 수 없어요.'; return; }
    status.textContent = '';
    try {
      await setDoc(doc(fs, 'house', id), { who: who.slice(0, 12), uid: myUid(), start: serverTimestamp(), rel: false, blanket: false, mins: mins });
      nameI.value = '';
      candyTry('sofa');
    } catch(err){ said.textContent = CONTENT.sofa.busy; }
  }}, nameI, restBtn);
  var upBtn = h('button',{class:'btn',type:'button',onclick:async function(){
    try { await updateDoc(doc(fs, 'house', id), { rel: true }); said.textContent = pick(asList(CONTENT.sofa.up)); } catch(err){}
  }},'일어나기');
  var coverBtn = h('button',{class:'btn',type:'button',onclick:async function(){
    try { await updateDoc(doc(fs, 'house', id), { blanket: true }); said.textContent = pick(asList(CONTENT.sofa.cover)); } catch(err){}
  }},'담요 덮어주기');
  var sawTaken = false;
  widgets[id] = function(){
    var st = sofaState(id);
    if (!(canShare && fs) || S.off[id]){
      said.textContent = freeLine;

    coverBtn.hidden = !(st && !st.blanket && st.uid !== myUid() && N.authOk);
    if (st){
      var m = Math.floor(st.left/60000), sec = Math.floor((st.left%60000)/1000);
      var tk = asList(CONTENT.sofa.taken), bl = asList(CONTENT.sofa.blanket), sk = Math.floor(st.start / 1000);
      said.textContent = st.who + tk[sk % tk.length] + ' (남은 시간 ' + m + ':' + (sec < 10 ? '0' : '') + sec + ')' + (st.blanket ? ' ' + bl[sk % bl.length] : '');
      sawTaken = true;

/* 찬장과 싱크대: 한 문서를 모두가 같이 쓴다. 서버 규칙이 한 번에 한 칸씩만 줄고 늘게 한다 */
function pantryDefaults(){ return { ck:'coffee', cn:PANTRY_N, s1k:'c1', s1n:PANTRY_N, s2k:'c2', s2n:PANTRY_N, cups:0, bowls:0 }; }
/* 잼 칸(jk, jn)과 잼 나이프(kn)는 나중에 붙은 필드라 옛 문서에는 없다. 없으면 기본값으로 보고, 바뀐 값만 서버에 쓴다 */
function pantryPick(d){
  var o = {}; ['ck','cn','s1k','s1n','s2k','s2n','cups','bowls'].forEach(function(k){ o[k] = d[k]; });
  o.jk = (typeof d.jk === 'string' && CONTENT.pantry.jams[d.jk]) ? d.jk : 'j1';
  o.jn = typeof d.jn === 'number' ? d.jn : PANTRY_N;
  o.kn = Number(d.kn) || 0;
  return o;
}
function pantryOk(){ return !!(canShare && fs && !S.off.pantry); }
var pantryInit = false;
function pantryEnsure(){
  if (pantryInit || !pantryOk()) return;
  pantryInit = true;
  setDoc(doc(fs, 'house', 'pantry'), pantryDefaults()).catch(function(){});
}
async function pantryAct(fn){
  if (!pantryOk()) return false;
  try {
    var ref = doc(fs, 'house', 'pantry');
    await runTransaction(fs, async function(tx){
      var snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('nodoc');
      var cur = pantryPick(snap.data());
      var next = fn(Object.assign({}, cur));
      if (!next) throw new Error('blocked');
      var diff = {};
      Object.keys(next).forEach(function(k){ if (next[k] !== cur[k]) diff[k] = next[k]; });
      tx.update(ref, diff);
    });
    return true;
  } catch(e){ return false; }
}
function meter(n){ return new Array(n + 1).join('●') + new Array(PANTRY_N - n + 1).join('○'); }
function pantryUI(){
  var C = CONTENT.pantry;
  var said = h('p',{class:'flavor','aria-live':'polite'});
  var sinkSaid = h('p',{class:'flavor','aria-live':'polite'});
  var shelf = h('div',{class:'shelf'});
  var sinkTxt = h('p',{class:'flavor'});
  var washFill = h('span',{class:'fill','aria-hidden':'true'});
  var washing = false;
  var washBtn = h('button',{class:'btn wash',type:'button',onclick:async function(){
    if (washing) return;
    washing = true; washBtn.disabled = true;
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
    if (!reduce){
      sinkSaid.textContent = C.washing;
      void washFill.offsetWidth;
      washBtn.classList.add('go');
      await new Promise(function(r){ setTimeout(r, 1000); });
    }
    washBtn.classList.remove('go');
    washing = false;
    if (!washBtn.isConnected){ return; }
    var gone = false;
    var ok = await pantryAct(function(d){ if (d.cups + d.bowls + d.kn < 1){ gone = true; return null; } d.cups = 0; d.bowls = 0; d.kn = 0; return d; });
    sinkSaid.textContent = ok ? C.wash : (gone ? C.washGone : C.fail); redrawPantryText();
    if (ok) candyTry('wash');
  }}, washFill, h('span',{class:'lbl2'},'설거지하기'));
  function redrawPantryText(){ if (widgets.pantry) widgets.pantry(); }
  function sinkFull(d){ return d.cups + d.bowls + d.kn >= SINK_MAX; }
  function slotEl(title, kindName, n, eatLabel, onEat, optionBtns, d){
    var kids = [h('div',{class:'sn'}, title), h('div',{class:'sn'}, kindName)];
    if (n > 0){
      kids.push(h('div',{class:'meter','aria-label':'남은 양 ' + n}, meter(n)));
      var b = h('button',{class:'btn',type:'button',disabled: sinkFull(d),onclick:onEat}, eatLabel);
      kids.push(b);
    } else {
      kids.push(h('p',{class:'empty'},'다 떨어졌다. 채울 걸 골라 주세요.'));
      kids.push(h('div',{class:'row'}, optionBtns));
    }
    return h('div',{class:'slot'}, kids);
  }
  async function eatCoffee(){
    var kind = '';
    var ok = await pantryAct(function(d){ if (d.cn < 1 || sinkFull(d)) return null; kind = d.ck; d.cn--; d.cups++; return d; });
    said.textContent = ok ? pick(C.eat[kind === 'cocoa' ? 'cocoa' : 'coffee']) : C.fail; redrawPantryText();
    if (ok) candyTry('coffee');
  }
  async function eatCereal(i){
    var ok = await pantryAct(function(d){ if (d['s'+i+'n'] < 1 || sinkFull(d)) return null; d['s'+i+'n']--; d.bowls++; return d; });
    said.textContent = ok ? pick(C.eat.cereal) : C.fail; redrawPantryText();
    if (ok) candyTry('cereal');
  }
  async function eatJam(){
    var kind = 'j1';
    var ok = await pantryAct(function(d){ if (d.jn < 1 || sinkFull(d)) return null; kind = d.jk; d.jn--; d.kn++; return d; });
    said.textContent = ok ? (C.eat.jam[kind] || '') + C.knife : C.fail; redrawPantryText();
  }
  async function refillJam(kind){
    var ok = await pantryAct(function(d){ if (d.jn !== 0) return null; d.jk = kind; d.jn = PANTRY_N; return d; });
    said.textContent = ok ? C.jams[kind] + '을(를) 채워 넣었다.' : C.fail; redrawPantryText();
  }
  async function refillCoffee(kind){
    var ok = await pantryAct(function(d){ if (d.cn !== 0) return null; d.ck = kind; d.cn = PANTRY_N; return d; });
    said.textContent = ok ? C.coffee[kind] + '을(를) 채워 넣었다.' : C.fail; redrawPantryText();
  }
  async function refillCereal(i, kind){
    var other = i === 1 ? 's2k' : 's1k';
    var ok = await pantryAct(function(d){ if (d['s'+i+'n'] !== 0 || d[other] === kind) return null; d['s'+i+'k'] = kind; d['s'+i+'n'] = PANTRY_N; return d; });
    said.textContent = ok ? C.cereals[kind] + '을(를) 채워 넣었다.' : C.fail; redrawPantryText();
  }
  widgets.pantry = function(){
    var d = S.pantry ? pantryPick(S.pantry) : null;
    if (!pantryOk() || !d){
      shelf.replaceChildren(h('p',{class:'empty'}, pantryOk() ? '찬장을 여는 중이에요.' : '찬장은 아직 준비 중이에요.'));
      sinkTxt.textContent = ''; washBtn.hidden = true;
      return;
    }
    washBtn.hidden = false;
    var coffeeOpts = ['coffee','cocoa'].map(function(k){ return h('button',{class:'btn',type:'button',onclick:function(){ refillCoffee(k); }}, C.coffee[k]); });
    var slots = [slotEl('커피 칸', C.coffee[d.ck] || '', d.cn, '마시기', eatCoffee, coffeeOpts, d)];
    [1,2].forEach(function(i){
      var other = d[i === 1 ? 's2k' : 's1k'];
      var opts = Object.keys(C.cereals).filter(function(k){ return k !== other; }).map(function(k){
        return h('button',{class:'btn',type:'button',onclick:function(){ refillCereal(i, k); }}, C.cereals[k]);
      });
      slots.push(slotEl('시리얼 칸 ' + i, C.cereals[d['s'+i+'k']] || '', d['s'+i+'n'], '먹기', function(){ eatCereal(i); }, opts, d));
    });
    var jamOpts = Object.keys(C.jams).map(function(k){ return h('button',{class:'btn',type:'button',onclick:function(){ refillJam(k); }}, C.jams[k]); });
    slots.push(slotEl('식빵과 잼 칸', C.jams[d.jk] || '', d.jn, '먹기', eatJam, jamOpts, d));
    shelf.replaceChildren.apply(shelf, slots);
    sinkTxt.textContent = '컵 ' + d.cups + '개 · 그릇 ' + d.bowls + '개' + (d.kn > 0 ? ' · 잼 나이프 ' + d.kn + '개' : '') + (sinkFull(d) ? ' — ' + C.full : '');
    washBtn.disabled = washing || d.cups + d.bowls + d.kn < 1;
  };
  widgets.pantry();
  pantryEnsure();
  return {
    shelf: h('div',{class:'tvwrap',style:'width:100%'}, shelf, said),
    sink: h('div',{class:'tvwrap'}, sinkTxt, washBtn, sinkSaid)
  };
}

function moodNow(){

/* ===== 쿠키 칸, 간식 칸 (찬장 아래): 5종 중 2종, 종류마다 5개. 접시는 남지 않는다 ===== */
S.cookies = null; S.snacks = null; S.marbles = null; S.reading = {}; S.tseat = [null, null, null]; S.tplate = null;
var STOCK_N = 5, stockInit = {};
function stockOk(key){ return !!(canShare && fs && !S.off[key]); }
function stockEnsure(key){
  if (stockInit[key] || !stockOk(key)) return;
  stockInit[key] = true;
  var two = pickN([0, 1, 2, 3, 4], 2);
  setDoc(doc(fs, 'house', key), { k1: two[0], n1: STOCK_N, k2: two[1], n2: STOCK_N }).catch(function(){});
}
async function stockAct(key, fn){
  if (!stockOk(key)) return false;
  try {
    var ref = doc(fs, 'house', key);
    await runTransaction(fs, async function(tx){
      var snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('nodoc');
      var d = snap.data();
      var next = fn({ k1: d.k1, n1: d.n1, k2: d.k2, n2: d.n2 });
      if (!next) throw new Error('blocked');
      tx.set(ref, next);
    });
    return true;
  } catch(e){ return false; }
}
function stockSlot(key, C, said){
  var slot = h('div',{class:'slot'});
  function cmeter(n){ return new Array(n + 1).join('●') + new Array(STOCK_N - n + 1).join('○'); }
  function again(){ if (widgets[key]) widgets[key](); }
  async function eat(i){
    var kind = -1;
    var ok = await stockAct(key, function(d){ if (d['n' + i] < 1) return null; kind = d['k' + i]; d['n' + i]--; return d; });
    said.textContent = ok ? C.kinds[kind].eat : CONTENT.pantry.fail; again();
  }
  async function refill(i, kind){
    var other = i === 1 ? 'k2' : 'k1';
    var ok = await stockAct(key, function(d){ if (d['n' + i] !== 0 || d[other] === kind) return null; d['k' + i] = kind; d['n' + i] = STOCK_N; return d; });
    said.textContent = ok ? C.kinds[kind].name + C.refilled : CONTENT.pantry.fail; again();
  }
  widgets[key] = function(){
    var d = S[key];
    if (!stockOk(key) || !d){
      slot.replaceChildren(h('p',{class:'empty'}, stockOk(key) ? C.title + '을(를) 여는 중이에요.' : C.notReady));
      return;
    }
    var kids = [h('div',{class:'sn'}, C.title)];
    [1, 2].forEach(function(i){
      var n = d['n' + i], other = d[i === 1 ? 'k2' : 'k1'], kind = C.kinds[d['k' + i]];
      var sub = [h('div',{class:'sn'}, kind ? kind.name : '')];
      if (n > 0){
        sub.push(h('div',{class:'meter','aria-label':'남은 개수 ' + n}, cmeter(n)));
        sub.push(h('button',{class:'btn',type:'button',onclick:function(){ eat(i); }}, '먹기'));
      } else {
        sub.push(h('p',{class:'empty'}, C.empty));
        sub.push(h('div',{class:'row'}, C.kinds.map(function(x, ki){
          return ki === other ? null : h('button',{class:'btn',type:'button',onclick:function(){ refill(i, ki); }}, x.name);
        })));
      }
      kids.push(h('div',{class:'subslot'}, sub));
    });
    slot.replaceChildren.apply(slot, kids);
  };
  widgets[key]();
  stockEnsure(key);
  return slot;
}
function stockBox(){
  var said = h('p',{class:'flavor','aria-live':'polite'});
  var row = h('div',{class:'shelf'}, stockSlot('cookies', CONTENT.cookies, said), stockSlot('snacks', CONTENT.snacks, said));
  return h('div',{class:'tvwrap',style:'width:100%'}, row, said);
}

/* ===== 기분 구슬 (현관): 하루에 한 사람이 2개, 병 6개. 모인 수는 모두에게 보인다. 하루 2개 제한은 이 브라우저 기준 ===== */
function dayNum(){ return Number(todayKST().replace(/-/g, '')); }
function marbleLeft(){
  var m = lsGet('crowley.marbles', null);
  var used = (m && m.day === todayKST()) ? (Number(m.used) || 0) : 0;
  return Math.max(0, CONTENT.marbles.perDay - used);
}
function marbleUse(){
  var m = lsGet('crowley.marbles', null);
  var used = (m && m.day === todayKST()) ? (Number(m.used) || 0) : 0;
  lsSet('crowley.marbles', { day: todayKST(), used: used + 1 });
}
function marbleCounts(){
  var d = S.marbles, out = [0, 0, 0, 0, 0, 0];
  if (d && d.d === dayNum()){ for (var i = 0; i < 6; i++) out[i] = Number(d['j' + i]) || 0; }
  return out;
}
async function marblePut(i){
  if (!(canShare && fs) || S.off.marbles) return false;
  var ref = doc(fs, 'house', 'marbles'), dn = dayNum(), k = 'j' + i;
  async function bumpIt(){ var p = {}; p[k] = increment(1); await updateDoc(ref, p); }

function readState(c){
  var d = S.reading[c];
  if (!d || typeof d.start !== 'number') return null;
  var left = d.start + (d.mins === 30 ? 30 : 15) * 60000 - Date.now();
  if (d.rel || left <= 0) return null;
  return { who: d.who, uid: d.uid, left: left, b: d.b };
}
function readingCount(){ var n = 0; for (var c = 0; c < CONTENT.books.cats.length; c++){ if (readState(c)) n++; } return n; }
function myReading(){
  var me = myUid();
  if (!me) return null;
  for (var c = 0; c < CONTENT.books.cats.length; c++){ var st = readState(c); if (st && st.uid === me) return { c: c, st: st }; }

    if (!(canShare && fs && !S.off.reading && N.authOk && myUid())){ msg = B.cant; widgets.reading(); return; }
    if (readingCount() >= B.seats){ msg = B.noSeat; widgets.reading(); return; }

    var sig = JSON.stringify([states.map(function(st){ return st ? [st.who, st.uid, st.b] : 0; }), cat, mine ? mine.c : -1, msg, wasMine]);
    if (sig === lastSig){ tickTimes(); return; }

    timeEls = {};
    corners.replaceChildren.apply(corners, B.cats.map(function(c, i){
      var st = states[i], isMine = !!(mine && mine.c === i), sel = !mine && cat === i;

      var tag = isMine ? '내가 읽는 중' : st ? '읽는 중' : sel ? '고른 분야' : '';

    }));
    if (mine){ wasMine = true; said.textContent = ''; }
    else {
      if (wasMine){ msg = B.closed; wasMine = false; lastSig = ''; }
      said.textContent = msg;
    }
  };
  widgets.reading();
  var tick = setInterval(function(){
    if (!said.isConnected){ clearInterval(tick); return; }
    if (widgets.reading) widgets.reading();
  }, 1000);
  return h('div',{class:'tvwrap',style:'width:100%'}, seats, corners, startRow, said);
}

var auth = null;
var N = { notes: [], votes: [], week: '', unsubs: [], open: false, authOk: false, kind: 'good', err: '' };
function weekKey(now){
  var d = new Date((now == null ? Date.now() : now) + 9*3600*1000);
  var back = (d.getUTCDay() + 6) % 7;
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - back)).toISOString().slice(0, 10);
}
function normName(x){ return String(x == null ? '' : x).replace(/\s+/g,' ').trim().toLowerCase(); }
function myUid(){ return (auth && auth.currentUser) ? auth.currentUser.uid : ''; }
function noteCounts(){
  var c = {};
  N.votes.forEach(function(v){
    var x = c[v.n] || (c[v.n] = { u:0, d:0, mine:'' });
    if (v.v === 'u') x.u++; else if (v.v === 'd') x.d++;
    if (v.u && v.u === myUid()) x.mine = v.v;
  });
  return c;
}
function weeklyWinners(kind){
  var cnt = noteCounts(), by = {};
  N.notes.forEach(function(n){
    if (n.k !== kind) return;
    var key = normName(n.who);
    if (!key) return;
    var g = by[key] || (by[key] = { name: n.who, up: 0, down: 0 });
    var c = cnt[n.id];
    if (c){ g.up += c.u; g.down += c.d; }
  });
  var best = null, out = [];
  Object.keys(by).forEach(function(k){
    var g = by[k], score = g.up - g.down;
    if (g.up + g.down < CONTENT.notes.minVotes || score <= 0) return;
    if (best === null || score > best){ best = score; out = [g.name]; }
    else if (score === best) out.push(g.name);
  });
  return out;
}
function notesReady(){ return !!(canShare && fs && !S.off.notes); }
function notesSubscribe(){
  if (!notesReady()) return;
  var wk = weekKey();
  if (wk === N.week && N.unsubs.length) return;
  N.unsubs.forEach(function(u){ try { u(); } catch(e){} });
  N.unsubs = []; N.week = wk; N.notes = []; N.votes = [];
  N.unsubs.push(onSnapshot(query(collection(fs, 'notes'), where('w', '==', wk)), function(snap){
    N.notes = snap.docs.map(function(d){
      var x = d.data({ serverTimestamps: 'estimate' });

    N.votes = snap.docs.map(function(d){ var x = d.data(); return { n: x.n, v: x.v, u: x.u }; });
    redraw('notes');
  }, featureOff('notes')));
}

  var stateP = h('p',{class:'gstate'});
  var enterBtn = h('button',{class:'btn',type:'button',onclick:onEnter},'입력하기');
  var lockEl = h('div',{class:'glock',hidden:true}, stateP, enterBtn, panel);
  desc.after(lockEl);

  function resetLock(){
    gl.open = false; gl.unlocked = false; gl.armed = false; gl.clicks = []; gl.msg = ''; firstP.hidden = true;
    clearTimeout(gl.armT); pinI.value = ''; newPinI.value = '';
  }
  /* 입력하기를 5초 안에 세 번 누르면 마스터 모드가 잠깐 켜진다 */
  function onEnter(){
    var now = Date.now();
    gl.clicks = gl.clicks.filter(function(t){ return now - t <= 5000; });
    gl.clicks.push(now);
    gl.open = true;
    if (gl.clicks.length >= 3){
      gl.armed = true; gl.clicks = [];
      clearTimeout(gl.armT);
      gl.armT = setTimeout(function(){ gl.armed = false; }, 30000);
    }
    render();
    pinI.focus();
  }
  async function submitCode(){
    if (!cur || !roomsOk()) return;
    var code = pinI.value.trim(); pinI.value = '';
    if (!code) return;
    var id = cur.id, rec = roomRec(id), st = rec ? rec.st : '';
    if (gl.armed){
      gl.armed = false; clearTimeout(gl.armT);
      var mh = CONTENT.guestLock && CONTENT.guestLock.masterHash;
      if (mh && await sha('master:' + code) === mh){
        gl.unlocked = false;
        if (st === 'set'){ if (await writeRoom(id, keep(rec, { st: 'open', pin: '' }))) gl.msg = '번호를 지웠다.'; }
        else if (st === 'open'){ gl.msg = '이미 열려 있다.'; }
        else { if (await writeRoom(id, keep(null, { st: 'open', pin: '' }))) gl.msg = '방을 열어 두었다.'; }
        render(); return;
      }
    }
    if (Date.now() < gl.until){ gl.msg = '잠시 후에 다시 눌러 주세요.'; render(); return; }
    if (st === 'open'){
      if (!/^\d{4}$/.test(code)){ gl.msg = '번호는 숫자 네 자리예요.'; render(); return; }
      if (await writeRoom(id, keep(rec, { st: 'set', pin: await sha(id + ':' + code) }))){
        gl.unlocked = true; gl.msg = '번호를 정했어요. 이제 설명을 바꿀 수 있어요.';
        /* 마스터키로 열린 방에서 처음 번호를 정한 사람에게만, 이 한 번 지문이 뜬다. 닫거나 다른 문을 누르면 사라진다 */
        if (cur.g.first){ firstP.textContent = cur.g.first; firstP.hidden = false; }
      }
    } else if (st === 'set'){
      if (await sha(id + ':' + code) === rec.pin){ gl.unlocked = true; gl.fails = 0; gl.msg = ''; }
      else {
        gl.fails++;
        if (gl.fails >= 5){ gl.until = Date.now() + 30000; gl.fails = 0; gl.msg = '잠시 후에 다시 눌러 주세요.'; }
        else gl.msg = '번호가 맞지 않아요.';
      }
    } else {
      gl.msg = '잠겨 있는 방이에요.';
    }
    render();
  }
  function shownDesc(){
    if (!cur) return null;
    var rec = roomRec(cur.id);
    return (rec && rec.desc) ? rec.desc : cur.g.desc;
  }
  var doorMeta = {};
  function applyDoors(){
    Object.keys(doorMeta).forEach(function(id){
      var m = doorMeta[id], rec = roomRec(id);
      if (m.g.spare) m.btn.hidden = !rec;
      var nm = (rec && rec.name) ? rec.name.replace(/\//g, '\n') : m.g.name;
      if (m.plate.textContent !== nm) m.plate.textContent = nm;
      m.btn.style.setProperty('--dc', (rec && rec.color) ? rec.color : m.g.color);
      var sg = (rec && rec.sign) || '';
      m.sign.hidden = !sg; m.sign.textContent = sg; m.sign.dataset.s = sg;
      m.btn.setAttribute('aria-label', nm.replace(/\n/g, ' ') + ' 방 문' + (sg ? ', 팻말: ' + sg : ''));
    });
  }
  function render(){
    applyDoors();
    if (!cur){ lockEl.hidden = true; return; }
    desc.textContent = shownDesc();
    if (!roomsOk()){ lockEl.hidden = true; return; }
    lockEl.hidden = false;
    var rec = roomRec(cur.id), st = rec ? rec.st : '';
    stateP.textContent = st === 'open' ? '방 주인의 번호를 기다리는 방.' : st === 'set' ? '주인이 있는 방.' : '';
    panel.hidden = !gl.open;
    var editing = gl.unlocked && st === 'set';
    pinForm.hidden = editing;
    editBox.hidden = !editing;
    if (editing && descI.dataset.room !== cur.id){ descI.value = (rec && rec.desc) || ''; nameI.value = (rec && rec.name) || ''; pickColor = (rec && rec.color) || cur.g.color; paintSwatches(); pickSign = (rec && rec.sign) || ''; paintSigns(); descI.dataset.room = cur.id; }
    if (!editing) descI.dataset.room = '';
    msgP.textContent = gl.msg;
  }
  widgets.rooms = render;

  /* 예비 문 칸 10개(s1~s10): 열기 전에는 복도에 보이지 않는다 */
  var SPARE_N = 10;
  var spareList = [];
  for (var sp = 1; sp <= SPARE_N; sp++) spareList.push({ id: 's' + sp, spare: true, name: '새 방', color: '#3b4a63', desc: '아직 아무도 꾸미지 않은 방이다.' });
  var doors = CONTENT.guests.concat(spareList).map(function(g, i){
    var id = g.id || 'g' + (i + 1);
    var plate = h('span',{class:'plate'}, g.name);
    var sign = h('span',{class:'dsign',hidden:true});
    var b = h('button',{class:'door',type:'button','aria-pressed':'false','aria-label':g.name.replace(/\n/g,' ') + ' 방 문',style:'--dc:' + g.color}, sign, plate);
    doorMeta[id] = { btn: b, plate: plate, sign: sign, g: g };
    b.addEventListener('click', function(){
      doors.forEach(function(d){ d.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      if (!cur || cur.id !== id) resetLock();
      cur = { g: g, id: id };
      render();
    });
    return b;
  });
  hall.append.apply(hall, doors);
  applyDoors();

  /* 새 방 열기(우온 전용): '객식구 복도' 제목을 5초 안에 세 번 누르면 마스터 번호 칸이 나온다 */
  var spareMsg = h('p',{class:'gstate','aria-live':'polite'});
  var codeI = h('input',{type:'password',autocomplete:'off',maxlength:'40',placeholder:'마스터 번호','aria-label':'마스터 번호'});
  var spName = h('input',{type:'text',maxlength:'16',autocomplete:'off',placeholder:'문패 이름 (줄바꿈은 /)','aria-label':'새 방 문패 이름'});
  var spDesc = h('input',{type:'text',maxlength:'60',autocomplete:'off',placeholder:'방 설명','aria-label':'새 방 설명'});
  var openBtn = h('button',{class:'btn',type:'button'},'새 방 열기');
  var codeBtn = h('button',{class:'btn',type:'submit'},'확인');
  var codeForm = h('form',{class:'row'}, codeI, codeBtn);
  var spBox = h('div',{class:'spare',hidden:true}, codeForm, h('div',{class:'row'}, spName), h('div',{class:'row'}, spDesc), h('div',{class:'row'}, openBtn), spareMsg);
  var spOk = false;
  function spPaint(){
    codeForm.hidden = spOk; spName.parentNode.hidden = !spOk; spDesc.parentNode.hidden = !spOk; openBtn.parentNode.hidden = !spOk;
  }
  spPaint();
  codeForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var code = codeI.value.trim(); codeI.value = '';
    var mh = CONTENT.guestLock && CONTENT.guestLock.masterHash;
    if (code && mh && await sha('master:' + code) === mh){ spOk = true; spareMsg.textContent = ''; }
    else spareMsg.textContent = '번호가 맞지 않아요.';
    spPaint();
  });
  openBtn.addEventListener('click', async function(){
    if (!spOk || !roomsOk()) return;
    var nm = spName.value.trim().slice(0, 16);
    if (!nm){ spareMsg.textContent = '문패 이름을 적어 주세요.'; return; }
    var free = '';
    for (var k = 1; k <= SPARE_N; k++){ if (!roomRec('s' + k)){ free = 's' + k; break; } }
    if (!free){ spareMsg.textContent = '더 열 수 있는 칸이 없어요.'; return; }
    var col = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    var ok = await writeRoom(free, { st: 'open', pin: '', desc: spDesc.value.trim().slice(0, 60), name: nm, color: col, sign: '' });
    if (ok){ spareMsg.textContent = '방을 열었어요. 복도 끝에서 찾을 수 있어요.'; spName.value = ''; spDesc.value = ''; }
    else spareMsg.textContent = gl.msg || '지금은 할 수 없어요.';
  });
  hall.after(spBox);
  var hClicks = [];
  var hTitle = $('#hall-title');
  if (hTitle) hTitle.addEventListener('click', function(){
    var now = Date.now();
    hClicks = hClicks.filter(function(t){ return now - t <= 5000; }); hClicks.push(now);
    if (hClicks.length >= 3){ hClicks = []; spBox.hidden = !spBox.hidden; if (spBox.hidden){ spOk = false; spPaint(); } }
  });
})();

/* ===== 가끔 일어나는 일 ===== */
function loop(fn, min, max){
  function go(){ setTimeout(function(){ fn(); go(); }, (min + Math.random()*(max - min))*1000); }
  go();
}
var leakEl = $('#leak'), leakT = null;
function showLeak(){
  leakEl.textContent = pick(CONTENT.study);
  leakEl.classList.add('show');
  clearTimeout(leakT);
  leakT = setTimeout(function(){ leakEl.classList.remove('show'); }, 10000);
}
/* 서재: 모두에게 같은 시계로 정해진다. 약 9분 주기마다 2~4분 동안 크롤리가 들어와 있고, 그동안 40초쯤 간격으로 대사가 새어 나온다 */
var STUDY_CYCLE = 9*60*1000, lastLeak = 0;
function studyPresentAt(now){
  var slot = Math.floor(now / STUDY_CYCLE);
  var r = mulberry32(slot * 7919 + 17);
  var off = 30000 + r()*240000, dur = 120000 + r()*120000;
  var t = now - slot*STUDY_CYCLE;
  return t >= off && t < off + dur;
}
function studyTick(){
  var now = Date.now();
  var inside = studyPresentAt(now);
  var hint = $('.rh', $('[data-room="study"]'));
  if (inside && !studyIn){
    studyIn = true; hint.textContent = '인기척이 있음';
    if (!document.hidden){ showLeak(); lastLeak = now; }
  } else if (!inside && studyIn){
    studyIn = false; hint.textContent = '잠겨 있음';
  } else if (inside && !document.hidden && now - lastLeak >= 40000){
    showLeak(); lastLeak = now;
  }
}
studyTick();
setInterval(studyTick, 5000);
loop(tvOn, 45, 130);

/* ===== 할로윈 스킨: 이벤트 기간(CONTENT.candy.endAt 전)에만 켜진다 ===== */
var PUMPKIN_SVG = '<svg class="hwpump" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="14" rx="10" ry="7.5" fill="#e8892b"/><path d="M12 7Q12 4 15 3" stroke="#7aa045" stroke-width="2" fill="none"/><path d="M7 12L9 15L11 12Z M13 12L15 15L17 12Z" fill="#2a1408"/><path d="M8 17.5Q12 20 16 17.5" stroke="#2a1408" stroke-width="1.5" fill="none"/></svg>';
function applySkin(){
  var on = candyShown(), title = $('h1');
  document.body.classList.toggle('hw', on);
  var had = title && $('.hwpump', title);
  if (on && title && !had) title.insertAdjacentHTML('afterbegin', PUMPKIN_SVG);
  if (!on && had) had.remove();
}
applySkin();
setInterval(applySkin, 60000);

/* ===== 공유 저장소 연결 ===== */
try {
  var app = initializeApp(firebaseConfig);
  fs = getFirestore(app);
  canShare = true;
  try {
    auth = getAuth(app);
    signInAnonymously(auth).then(function(){ N.authOk = true; redraw('notes'); }).catch(function(){ N.authOk = false; redraw('notes'); });
  } catch(e){ N.authOk = false; }
  notesSubscribe();
  setInterval(notesSubscribe, 60000);
  onSnapshot(query(collection(fs, 'guestbook'), orderBy('ts', 'desc'), limit(9)), function(snap){
    S.guestRemote = snap.docs.map(toRow);
    redraw('guestbook');
  }, shareFailed);
  onSnapshot(query(collection(fs, 'whiteboard'), orderBy('ts', 'desc'), limit(12)), function(snap){
    S.board = snap.docs.map(function(d){ var x = d.data({ serverTimestamps: 'estimate' }); return { id: d.id, t: x.t, ts: tsMs(x.ts) }; });
    redraw('board');
  }, shareFailed);
  onSnapshot(doc(fs, 'house', 'fridge'), function(snap){ S.fridge = snap.exists() ? snap.data() : null; redraw('fridge'); }, shareFailed);
  onSnapshot(doc(fs, 'house', 'doorNote'), function(snap){ S.door = snap.exists() ? snap.data() : null; redraw('door'); }, shareFailed);
  onSnapshot(doc(fs, 'house', 'fridgeUser'), function(snap){ S.fridgeUser = snap.exists() ? snap.data() : null; redraw('fridge'); }, featureOff('fridgeUser'));
  onSnapshot(doc(fs, 'house', 'marker'), markerOnState, featureOff('marker'));
  onSnapshot(collection(fs, 'guestRooms'), function(snap){
    var map = {};
    snap.docs.forEach(function(d){ var x = d.data(); map[d.id] = { st: x.st, pin: x.pin || '', desc: x.desc || '', name: x.name || '', color: /^#[0-9a-f]{6}$/i.test(x.color || '') ? x.color : '', sign: ['부재중', '휴식 중', '노크 금지', '출입허용', '출입금지', '순찰중'].indexOf(x.sign) >= 0 ? x.sign : '' }; });
    S.rooms = map;
    redraw('rooms');
  }, featureOff('rooms'));
  onSnapshot(doc(fs, 'house', 'vase'), function(snap){
    if (!snap.exists()){ S.vase = null; } else {
      var x = snap.data(), v = {};
      for (var i = 0; i < 5; i++){ v['f'+i] = x['f'+i]; v['w'+i] = x['w'+i]; v['t'+i] = x['t'+i] ? tsMs(x['t'+i]) : (x['f'+i] ? Date.now() : 0); }
      S.vase = v;
    }
    redraw('vase');
  }, featureOff('vase'));
  ['sofa', 'sofa2', 'sofa3'].forEach(function(sid){
    onSnapshot(doc(fs, 'house', sid), function(snap){
      if (!snap.exists()){ S[sid] = null; } else {
        var x = snap.data({ serverTimestamps: 'estimate' });
        S[sid] = { who: x.who, uid: x.uid, start: tsMs(x.start), rel: !!x.rel, blanket: !!x.blanket, mins: x.mins === 30 ? 30 : 15 };
      }
      redraw(sid);
    }, featureOff(sid));
  });
  onSnapshot(doc(fs, 'house', 'pantry'), function(snap){
    S.pantry = snap.exists() ? snap.data() : null;
    if (!snap.exists()) pantryEnsure();
    redraw('pantry');
  }, featureOff('pantry'));
  onSnapshot(doc(fs, 'house', 'mood'), function(snap){
    if (!snap.exists()){ S.mood = null; } else {
      var x = snap.data({ serverTimestamps: 'estimate' });
      S.mood = { k: x.k, who: x.who || '', ts: tsMs(x.ts) };
    }
    redraw('mood');
  }, featureOff('mood'));
  ['cookies', 'snacks'].forEach(function(key){
    onSnapshot(doc(fs, 'house', key), function(snap){
      S[key] = snap.exists() ? snap.data() : null;
      if (!snap.exists()) stockEnsure(key);
      redraw(key);
    }, featureOff(key));
  });
  onSnapshot(doc(fs, 'house', 'marbles'), function(snap){ S.marbles = snap.exists() ? snap.data() : null; redraw('marbles'); }, featureOff('marbles'));
  [0, 1, 2].forEach(function(i){
    onSnapshot(doc(fs, 'table', 'seat' + i), function(snap){
      if (!snap.exists()){ S.tseat[i] = null; } else {
        var x = snap.data({ serverTimestamps: 'estimate' });
        S.tseat[i] = { who: x.who, uid: x.uid, start: tsMs(x.start), rel: !!x.rel };
      }
      redraw('table');
    }, featureOff('table'));
  });
  onSnapshot(doc(fs, 'table', 'plate'), function(snap){
    if (!snap.exists()){ S.tplate = null; } else {
      var x = snap.data({ serverTimestamps: 'estimate' });
      S.tplate = { food: x.food, who: x.who, uid: x.uid, at: tsMs(x.at), gone: !!x.gone };
    }
    redraw('table');
  }, featureOff('table'));
  [0, 1, 2, 3, 4].forEach(function(c){
    onSnapshot(doc(fs, 'reading', String(c)), function(snap){
      if (!snap.exists()){ S.reading[c] = null; } else {
        var x = snap.data({ serverTimestamps: 'estimate' });
        S.reading[c] = { who: x.who, uid: x.uid, start: tsMs(x.start), rel: !!x.rel, mins: x.mins === 30 ? 30 : 15, b: Number(x.b) || 0 };
      }
      redraw('reading');
    }, featureOff('reading'));
  });
  onSnapshot(doc(fs, 'house', 'candy'), function(snap){ S.candy = snap.exists() ? snap.data() : null; redraw('candy'); }, featureOff('candy'));
  onSnapshot(doc(fs, 'house', 'knock'), function(snap){ S.knock = snap.exists() ? snap.data() : null; redraw('knock'); }, featureOff('knock'));
  onSnapshot(doc(fs, 'house', 'fridgeStats'), function(snap){ S.fridgeStats = snap.exists() ? snap.data() : null; redraw('fridge'); }, featureOff('fridgeStats'));
} catch(e){ canShare = false; }
})();
